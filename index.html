<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FIT-ALL</title>
<meta name="description" content="Entreno, dieta, peso y progreso en un solo sitio.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FIT-ALL">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: una sola columna tipo app móvil (máx. 640px), cabecera con la fase del ciclo, barra de pestañas fija abajo con iconos en círculos de cristal.
   Color: siempre oscuro. Fondo negro, recuadros en gris, títulos e iconos en verde neón; los macros llevan los colores de los discos olímpicos. */
:root{
  --bg:#000000; --surface:#1c1c1f; --surface-2:#2a2a2e; --line:#38383d;
  --fg:#f2f2f5; --muted:#a3a3ad;
  --neon:#39ff14; --neon-glow:rgba(57,255,20,.45); --neon-soft:rgba(57,255,20,.14);
  --accent:#39ff14; --accent-fg:#000000; --accent-soft:rgba(57,255,20,.14);
  --blue:#4d8bff; --red:#ff5d63; --yellow:#f2c230; --green:#39d96a; --warn:#ff9f43;
  --f-display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
  color-scheme:dark;
}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums}
*{box-sizing:border-box}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 150px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance;color:var(--neon)}
h1,h2{text-shadow:0 0 14px var(--neon-glow)}
h1{font-size:30px;line-height:1}
h2{font-size:22px;line-height:1.1}
h3{font-size:18px;line-height:1.15}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--neon);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Cabecera */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:10px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;border-bottom:1px solid var(--line);margin-bottom:16px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.phase{text-align:right;font-size:13px;line-height:1.25;min-width:0}
.phase b{font-family:var(--f-display);font-size:18px;display:block;color:var(--neon)}

/* Navegación */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(0,0,0,.72);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);border-top:1px solid rgba(255,255,255,.08);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{background:none;border:0;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--muted)}
.nav .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--neon);
  background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,.04));
  border:1px solid rgba(255,255,255,.18);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25),inset 0 -1px 0 rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.5);
  -webkit-backdrop-filter:blur(12px) saturate(170%);backdrop-filter:blur(12px) saturate(170%);transition:box-shadow .2s,background .2s}
.nav .ic svg{width:22px;height:22px;filter:drop-shadow(0 0 4px var(--neon-glow))}
.nav button[aria-current="page"]{color:var(--neon)}
.nav button[aria-current="page"] .ic{background:linear-gradient(160deg,rgba(57,255,20,.30),rgba(57,255,20,.08));border-color:rgba(57,255,20,.55);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 0 16px var(--neon-glow),0 4px 14px rgba(0,0,0,.5)}

/* Bloques */
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
hr{border:0;border-top:1px solid var(--line);margin:4px 0}

.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:9px 14px;font-weight:600;line-height:1.1}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:none}
.btn.danger{color:var(--red);background:none;border-color:var(--line)}
.btn.sm{padding:6px 10px;font-size:14px}
.btn.block{width:100%;padding:13px}
.btn:disabled{opacity:.5;cursor:default}

input.tx,select.tx,textarea.tx{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0}
textarea.tx{resize:vertical;min-height:40px}
label.lb{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600;min-width:0}
label.lb > input,label.lb > select{color:var(--fg);font-weight:400;font-size:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:420px){.grid4{grid-template-columns:repeat(2,1fr)}}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}

/* Sesiones de hoy */
.ses{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center}
.ses-n{font-family:var(--f-display);font-size:26px;font-weight:700;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--fg)}
.ses.hecha .ses-n{background:var(--green);color:var(--surface)}

/* Macros */
.macro{display:flex;flex-direction:column;gap:5px}
.macro-top{display:flex;justify-content:space-between;font-size:14px;gap:8px}
.bar{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:5px}
.bar.over i{background:var(--warn)!important}
.kcal-big{font-family:var(--f-display);font-size:40px;font-weight:700;line-height:1}

/* Interruptores */
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.tog:first-of-type{border-top:0}
.sw{width:50px;height:30px;border-radius:15px;background:var(--surface-2);border:1px solid var(--line);position:relative;flex:none;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:left .15s}
.sw[aria-pressed="true"]{background:var(--green);border-color:var(--green)}
.sw[aria-pressed="true"]::after{left:23px;background:var(--surface)}

/* Editor de entreno */
.ex{display:flex;flex-direction:column;gap:10px}
.ex-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ex-meta{font-size:13px;color:var(--muted)}
.hint{font-size:13px;padding:7px 10px;border-radius:8px;background:var(--surface-2);color:var(--fg)}
.hint.up{background:color-mix(in srgb,var(--green) 14%,transparent);color:var(--green);font-weight:600}
.set{display:grid;grid-template-columns:22px 1fr 14px 1fr 44px;gap:8px;align-items:center}
.set.solo{grid-template-columns:22px 1fr 44px}
.si{font-family:var(--f-display);font-size:18px;color:var(--muted);text-align:center}
.fld{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding-right:8px;min-width:0}
.fld input{border:0;background:none;width:100%;min-width:0;padding:9px 8px;font-size:17px;font-weight:600;text-align:right}
.fld input::placeholder{color:var(--muted);opacity:.55;font-weight:500}
.fld span{font-size:12px;color:var(--muted)}
.x{text-align:center;color:var(--muted)}
.chk{width:44px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);font-weight:700;font-size:18px;color:var(--muted)}
.set.ok .chk{background:var(--green);border-color:var(--green);color:var(--surface)}
.set.ok .fld{border-color:color-mix(in srgb,var(--green) 60%,var(--line))}

/* Temporizador */
.timer{position:fixed;left:0;right:0;z-index:9;bottom:calc(90px + env(safe-area-inset-bottom,0px));padding-inline:16px;pointer-events:none}
.timer-in{max-width:608px;margin:0 auto;background:var(--fg);color:var(--bg);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px;pointer-events:auto;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.timer-t{font-family:var(--f-display);font-size:32px;font-weight:700;min-width:84px}
.timer-in .btn{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 40%,transparent)}
.timer-bar{height:4px;border-radius:2px;background:color-mix(in srgb,var(--bg) 25%,transparent);overflow:hidden;flex:1;min-width:30px}
.timer-bar i{display:block;height:100%;background:var(--bg)}

/* Listas */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .grow{display:flex;flex-direction:column}
.li button.lnk{background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;flex:1;min-width:0}
.iconbtn{background:none;border:0;color:var(--muted);padding:6px 8px;border-radius:6px;font-size:18px;line-height:1}
.meal-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-top:4px}

.tbl-w{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 6px;border-top:1px solid var(--line);white-space:nowrap}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-top:0}
td.n,th.n{text-align:right}

.chart{width:100%;height:auto;display:block}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--f-display);font-size:26px;line-height:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

details > summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
details > summary::-webkit-details-marker{display:none}
details > summary::after{content:"+";font-size:20px;color:var(--muted)}
details[open] > summary::after{content:"−"}

.banner{background:color-mix(in srgb,var(--warn) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line));color:var(--fg);border-radius:var(--r);padding:12px 14px;font-size:14px}
.empty{padding:22px 10px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));z-index:20;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:15px;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.25)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
/* Agua */
.agua-big{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1;color:var(--blue)}
.gotas{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-width:360px}
.gota{background:none;border:0;padding:4px;border-radius:10px;aspect-ratio:1;display:grid;place-items:center}
.gota svg{width:100%;height:100%;max-width:30px;fill:transparent;stroke:color-mix(in srgb,var(--blue) 55%,var(--line));stroke-width:1.6;transition:fill .15s,filter .15s}
.gota.llena svg{fill:var(--blue);stroke:var(--blue);filter:drop-shadow(0 0 6px rgba(77,139,255,.55))}
/* Comida libre (lo que no está en Mis alimentos) */
.libre{display:flex;flex-direction:column;gap:8px;padding:10px;border:1px dashed var(--line);border-radius:8px}
.libre[hidden]{display:none}
.estim{display:flex;flex-direction:column;gap:6px;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:14px}
.estim .row{gap:8px;flex-wrap:nowrap;align-items:baseline}
.estim-tot{border-top:1px solid var(--line);padding-top:6px}
textarea.tx{resize:vertical;min-height:52px;font:inherit}
/* Escáner de códigos de barras */
.scan{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.scan[hidden]{display:none}
.scan-in{max-width:608px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.scan-body{display:flex;flex-direction:column;gap:12px}
.scan-video{position:relative;border-radius:12px;overflow:hidden;background:#111;aspect-ratio:4/3}
.scan-video video{width:100%;height:100%;object-fit:cover;display:block}
.scan-guia{position:absolute;left:12%;right:12%;top:32%;bottom:32%;border:2px solid var(--accent);border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
body.scan-abierto{overflow:hidden}
.chkrow{display:flex;gap:10px;align-items:flex-start;flex-wrap:nowrap;line-height:1.35}
.chkrow input{width:20px;height:20px;flex:none;margin:0;accent-color:var(--accent)}
/* Biblioteca de ejercicios y fichas */
.bib{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;overscroll-behavior:contain}
.bib[hidden]{display:none}
.bib-in{max-width:640px;margin:0 auto;padding:12px 16px calc(110px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.bib-head{position:sticky;top:0;z-index:2;background:rgba(0,0,0,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.bib-head .bib-in{padding-bottom:12px;gap:10px}
.bib-barra{padding-top:env(safe-area-inset-top,0px)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.fam-h{font-family:var(--f-display);font-weight:700;color:var(--neon);font-size:16px;letter-spacing:.04em;text-transform:uppercase;padding-top:10px}
.bib-row{display:flex;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.fam-h + .bib-row{border-top:0}
.bib-row > button{background:none;border:0;padding:0;text-align:left;color:inherit}
.bib-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;align-self:stretch;justify-content:center}
.bib-chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-weight:700;color:var(--accent-fg)}
.bib-row.sel .bib-chk{background:var(--accent);border-color:var(--accent)}
.bib-row.sel .ej-foto{box-shadow:0 0 0 2px var(--accent)}
.bib-pie{position:fixed;left:0;right:0;bottom:0;z-index:31;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(0,0,0,.88);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.bib-pie .btn{max-width:608px;margin:0 auto;display:block}
.ej-foto,.ej-anim{display:block;position:relative;overflow:hidden;border-radius:10px;background:#e9e9ec;aspect-ratio:3/2;flex:none}
.ej-foto{width:72px}
.ej-foto img,.ej-anim img{position:absolute;top:0;left:0;width:200%;height:100%;max-width:none;object-fit:cover}
.ej-foto.vacia{display:grid;place-items:center;background:var(--surface-2);color:var(--muted)}
.ej-foto.vacia.grande{width:100%;border-radius:14px}
.ej-anim img + img{transform:translateX(-50%);animation:fotograma 2.6s ease-in-out infinite}
@keyframes fotograma{0%,28%{opacity:0}46%,78%{opacity:1}96%,100%{opacity:0}}
.ej-anim.grande{width:100%;border-radius:14px}
.ej-mini{width:72px;border:0;padding:0;background:none;flex:none;border-radius:10px}
.ex-h .ej-mini{align-self:flex-start;width:68px}
.lnk-btn{background:none;border:0;padding:4px 0 0;color:var(--neon);font-size:14px;font-weight:600;text-align:left}
ol.pasos{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
ol.pasos li::marker{color:var(--neon);font-weight:700}
.ficha-mus{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:center}
.ficha-mus .small{display:flex;flex-direction:column;gap:6px}
/* Mapa del cuerpo */
:root{--mus-0:#3a3a41}
.cuerpo{width:100%;max-width:400px;height:auto;display:block;margin:0 auto;-webkit-tap-highlight-color:transparent}
.cuerpo .sil{fill:#232327;stroke:#55555e;stroke-width:2.2}
.cuerpo .sil-f{fill:#232327}
.cuerpo .m{stroke:#0b0b0c;stroke-width:1.1;stroke-linejoin:round;transition:fill .25s}
.cuerpo .m.sel{stroke:#fff;stroke-width:2}
.cuerpo [data-act] .m{cursor:pointer}
.cuerpo .det{fill:none;stroke:rgba(0,0,0,.4);stroke-width:1;pointer-events:none}
.cuerpo-lbl{fill:var(--muted);font-size:12px;font-family:var(--f-body)}
.cuerpo.mini{max-width:230px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:none;color:var(--muted);font-weight:600;font-size:14px;padding:6px 12px;border-radius:7px}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--neon);box-shadow:0 1px 3px rgba(0,0,0,.5)}
.leyenda{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);justify-content:center}
.leyenda i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
.mus-det{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:10px;background:var(--surface-2)}
.mus-det .li{border-top-color:#44444b}
.musl{display:flex;flex-direction:column;margin-top:6px}
.musrow{display:grid;grid-template-columns:118px 1fr 64px;gap:10px;align-items:center;background:none;border:0;padding:7px 0;text-align:left;width:100%;font-size:14px;color:var(--fg)}
.musrow b{font-weight:600}
.musrow .small{text-align:right;white-space:nowrap}
.musrow .bar{height:8px}
.musrow.sel b{color:var(--neon)}
.sube{color:var(--green)}
.baja{color:var(--red)}
/* Objetivo calculado y pasos */
.hint.obj{display:flex;flex-direction:column;gap:3px;border-left:3px solid var(--neon)}
.hint.obj b{font-size:15px}
.hint.down{background:color-mix(in srgb,var(--warn) 14%,transparent);border-left-color:var(--warn)}
.hint.up{border-left:3px solid var(--green)}
.pasos-sem{position:relative;display:grid;grid-template-columns:repeat(7,1fr);gap:6px;height:84px;max-width:360px}
.pb{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted)}
.pb-col{height:64px;width:100%;max-width:26px;display:flex;align-items:flex-end;background:var(--surface-2);border-radius:5px;overflow:hidden}
.pb-col i{display:block;width:100%;background:color-mix(in srgb,var(--neon) 45%,var(--surface-2));border-radius:5px 5px 0 0}

/* ---------- fase del ciclo ---------- */

  const diff = Math.round((parseISO(f) - parseISO(obj().inicio)) / 86400000);

  const semana = Math.floor(diff/7) + 1;
  const sc = ((semana-1) % L) + 1;
  return Object.assign({ajuste:"igual"}, C.fases[sc-1], {semana, ciclo: Math.floor((semana-1)/L)+1, sc, total:C.semanas, fuera: semana>C.semanas});
}
function seriesSugeridas(objetivo, f){
  const m = String(objetivo||"").match(/^(\d+)\s*×/);
  if (!m) return 1;
  const base = +m[1];
  if (!f) return base;
  if (f.ajuste === "menos1") return Math.max(1, base-1);
  if (f.ajuste === "descarga") return Math.max(1, Math.round(base*0.6));
  if (f.ajuste === "mas1") return base+1;
  return base;
}

mbre": "Pan de barra", "base": 100, "unidad": "g", "kcal": 270, "p": 9, "c": 55, "g": 1.5, "nota": "Barra de 250 g; un trozo ≈ 60 g", "id": "pan-de-barra"}, {"nombre": "Pan integral", "base": 100, "unidad": "g", "kcal": 250, "p": 9, "c": 45, "g": 3.5, "id": "pan-integral"}, {"nombre": "Pasta (cocida)", "base": 100, "unidad": "g", "kcal": 158, "p": 5.8, "c": 31, "g": 0.9, "id": "pasta-cocida"}, {"nombre": "Pasta (cruda)", "base": 100, "unidad": "g", "kcal": 357, "p": 12.5, "c": 72, "g": 1.5, "nota": "Ración típica 80-100 g en crudo", "id": "pasta-cruda"}, {"nombre": "Patata (cocida)", "base": 100, "unidad": "g", "kcal": 80, "p": 2, "c": 17, "g": 0.1, "id": "patata-cocida"}, {"nombre": "Pavo, pechuga (cocinada)", "base": 100, "unidad": "g", "kcal": 150, "p": 29, "c": 0, "g": 3, "id": "pavo-pechuga-cocinada"}, {"nombre": "Pechuga de pavo en lonchas", "base": 100, "unidad": "g", "kcal": 100, "p": 18, "c": 2, "g": 2, "id": "pechuga-de-pavo-en-lonchas"}, {"nombre": "Pechuga de pollo (a la plancha)", "base": 100, "unidad": "g", "kcal": 165, "p": 31, "c": 0, "g": 3.6, "id": "pechuga-de-pollo-a-la-plancha"}, {"nombre": "Plátano", "base": 1, "unidad": "ud", "kcal": 105, "p": 1.3, "c": 24, "g": 0.4, "nota": "Mediano, sin piel", "id": "platano"}, {"nombre": "Proteína en polvo (whey)", "base": 1, "unidad": "ud", "kcal": 120, "p": 24, "c": 2.5, "g": 1.5, "nota": "1 cacito ≈ 30 g; revisa tu etiqueta", "id": "proteina-en-polvo-whey"}, {"nombre": "Queso en lonchas (tranchete)", "base": 1, "unidad": "ud", "kcal": 50, "p": 3, "c": 1.2, "g": 3.8, "nota": "1 loncha ≈ 18 g", "id": "queso-en-lonchas-tranchete"}, {"nombre": "Queso fresco batido 0 %", "base": 100, "unidad": "g", "kcal": 46, "p": 8, "c": 3.5, "g": 0.1, "id": "queso-fresco-batido-0"}, {"nombre": "Salmón (cocinado)", "base": 100, "unidad": "g", "kcal": 210, "p": 22, "c": 0, "g": 13, "id": "salmon-cocinado"}, {"nombre": "Sardinas en aceite (escurridas)", "base": 100, "unidad": "g", "kcal": 210, "p": 24, "c": 0, "g": 13, "id": "sardinas-en-aceite-escurridas"}, {"nombre": "Ternera magra (cocinada)", "base": 100, "unidad": "g", "kcal": 190, "p": 29, "c": 0, "g": 8, "id": "ternera-magra-cocinada"}, {"nombre": "Tortilla de patatas", "base": 100, "unidad": "g", "kcal": 190, "p": 6.5, "c": 14, "g": 12, "nota": "Casera; una ración ≈ 150 g", "id": "tortilla-de-patatas"}, {"nombre": "Verduras variadas (cocidas)", "base": 100, "unidad": "g", "kcal": 30, "p": 2, "c": 5, "g": 0.2, "id": "verduras-variadas-cocidas"}, {"nombre": "Yogur natural", "base": 1, "unidad": "ud", "kcal": 75, "p": 4.4, "c": 5.6, "g": 4, "nota": "1 ud = 125 g", "id": "yogur-natural"}];
const BASE_IDS = new Set(ALIMENTOS_BASE.map(a => a.id));
const IDB_NOMBRE = "fitall", IDB_ALMACEN = "docs";
let idb = null;
function abrirIDB(){
  return new Promise(res => {
    try {
      const r = indexedDB.open(IDB_NOMBRE, 1);
      r.onupgradeneeded = () => r.result.createObjectStore(IDB_ALMACEN);
      r.onsuccess = () => res(r.result);
      r.onerror = () => res(null);
      r.onblocked = () => res(null);
    } catch(e){ res(null); }
  });
}
function leerTodo(){
  if (idb) return new Promise((res, rej) => {
    try { const r = idb.transaction(IDB_ALMACEN).objectStore(IDB_ALMACEN).getAll(); r.onsuccess = () => res(r.result || []); r.onerror = () => rej(r.error); }
    catch(e){ rej(e); }
  });
  const o = lsGet("fitall_docs") || {};
  return Promise.resolve(Object.entries(o).map(([path, data]) => ({path, data})));
}
function escribirVarios(ops, vaciar){
  if (idb) return new Promise((res, rej) => {
    try {
      const t = idb.transaction(IDB_ALMACEN, "readwrite"), st = t.objectStore(IDB_ALMACEN);
      if (vaciar) st.clear();
      ops.forEach(([path, data]) => data == null ? st.delete(path) : st.put({path, data}, path));
      t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    } catch(e){ rej(e); }
  });
  const o = vaciar ? {} : (lsGet("fitall_docs") || {});
  ops.forEach(([path, data]) => { if (data == null) delete o[path]; else o[path] = data; });
  try { localStorage.setItem("fitall_docs", JSON.stringify(o)); return Promise.resolve(); } catch(e){ return Promise.reject(e); }
}
const colas = {};
function escribir(path, data){
  marcarSync([path]);
  const p = (colas[path] || Promise.resolve()).then(() => escribirVarios([[path, data]])).catch(errGuardar);
  colas[path] = p; return p;
}
function borrarDoc(path){ return escribir(path, null); }
function errGuardar(){ toast("No se pudo guardar en este móvil. Comprueba que no estás en modo privado y que queda espacio."); }
function repartir(docs){
  S.plan = []; S.obj = null; S.alimentos = []; S.sesiones = []; S.diario = {}; S.medidas = []; S.entrenos = []; S.ejPropios = []; IDX = null;
  for (const {path, data} of docs){
    const i = path.indexOf("/"), c = path.slice(0, i), id = path.slice(i+1);
    if (path === "plan/rutina") S.plan = (data && data.sesiones) || [];
    else if (path === "config/objetivos") S.obj = data;
    else if (c === "alimentos") S.alimentos.push(Object.assign({id}, data));
    else if (c === "sesiones") S.sesiones.push(Object.assign({id}, data));
    else if (c === "diario") S.diario[id] = data;
    else if (c === "medidas") S.medidas.push(Object.assign({id}, data));
    else if (c === "entrenos") S.entrenos.push(Object.assign({id}, data));
    else if (c === "ejercicios") S.ejPropios.push(Object.assign({id, propio:true}, data));
  }
  S.alimentos.sort((a,b) => a.nombre.localeCompare(b.nombre, "es"));
  S.sesiones.sort((a,b) => a.fecha<b.fecha?1 : a.fecha>b.fecha?-1 : (b.n||0)-(a.n||0));
  S.medidas.sort((a,b) => a.fecha<b.fecha?-1 : 1);
  S.cargado.plan = S.cargado.obj = S.cargado.sesiones = true;
}
async function init(){

    docs = await leerTodo();
    if (!docs.length){
      await escribirVarios(ALIMENTOS_BASE.map(a => { const {id, ...r} = a; return ["alimentos/"+id, r]; }));
      docs = await leerTodo();
    }
  } catch(e){ S.sinDb = true; }
  repartir(docs);
  const cod = leerCodigo(location.hash);
  if (cod){ S.enlacePend = cod; S.tab = "ajustes"; try { history.replaceState(null, "", location.pathname); } catch(e) {} }
  render();
  setTimeout(() => enviarHoja(), 1500);
  setTimeout(() => sincronizar(), 600);
}

/* ---------- copia de seguridad ---------- */
function resumenCopia(d){
  const n = (d.sesiones||[]).length, m = (d.medidas||[]).length, dd = Object.keys(d.diario||{}).length;
  return `${n} sesiones, ${m} medidas y ${dd} días de dieta`;
}
async function leerCopia(file){
  let d;
  try { d = JSON.parse(await file.text()); } catch(e){ toast("Ese archivo no es una copia de FIT-ALL."); return; }
  if (!d || typeof d !== "object" || (!d.rutina && !d.sesiones && !d.objetivos)){ toast("Ese archivo no es una copia de FIT-ALL."); return; }

  if (!hayDatos){ await aplicarCopia(d); return; }

async function aplicarCopia(d){
  const ops = [];
  if (d.objetivos) ops.push(["config/objetivos", d.objetivos]);
  if (Array.isArray(d.rutina)) ops.push(["plan/rutina", {sesiones: d.rutina}]);
  (d.sesiones||[]).forEach(x => { const {id, ...r} = x; ops.push(["sesiones/" + (id || `${x.fecha}_${x.n}`), r]); });
  Object.entries(d.diario||{}).forEach(([k, v]) => ops.push(["diario/" + k, v]));
  (d.medidas||[]).forEach(x => { const {id, ...r} = x; ops.push(["medidas/" + (id || x.fecha), r]); });
  (d.entrenos||[]).forEach(x => { const {id, ...r} = x; ops.push(["entrenos/" + (id || nuevoId()), r]); });
  (d.ejerciciosPropios||[]).forEach(x => { const {id, propio, ...r} = x; ops.push(["ejercicios/" + (id || "p-" + slug(x.n)), r]); });
  const al = (d.alimentos && d.alimentos.length) ? d.alimentos : ALIMENTOS_BASE;
  al.forEach(x => { const {id, ...r} = x; ops.push(["alimentos/" + (id || slug(x.nombre) || nuevoId()), r]); });
  const antes = syncOn() ? (await leerTodo()).map(x => x.path) : [];
  try { await escribirVarios(ops, true); } catch(e){ errGuardar(); return; }
  marcarSync([...new Set(ops.map(o => o[0]).concat(antes))]);
  repartir(await leerTodo());
  S.importPend = null; S.cfgEd = null; S.cfgDirty = false; S.rutEd = null; S.ed = null; S.entEd = null;
  S.tab = "hoy"; render(); window.scrollTo(0,0);
  toast(`Copia cargada: ${resumenCopia(d)}.`);
}

function sesionesDeDia(f){
  const nombre = DIAS[parseISO(f).getDay()];

function ordenPlan(L){
  return L.slice().sort((a,b) => (DIAS_SEM.indexOf(a.dia) - DIAS_SEM.indexOf(b.dia)) || (TURNOS.indexOf(a.turno) - TURNOS.indexOf(b.turno)) || (a.n - b.n));
}
function totalesDia(f){
  const d = S.diario[f]; const t = {kcal:0,p:0,c:0,g:0};
  (d && d.items || []).forEach(i => { t.kcal+=i.kcal||0; t.p+=i.p||0; t.c+=i.c||0; t.g+=i.g||0; });
  return t;
}
function ultima(nombre, antesDe){
  for (const s of S.sesiones){
    if (antesDe && s.fecha >= antesDe) continue;
    const e = (s.ejercicios||[]).find(x => x.nombre === nombre);
    if (e && e.series && e.series.length) return {fecha:s.fecha, series:e.series, rir:e.rir};
  }
  return null;
}
const e1rm = (kg, reps) => (kg && reps) ? kg * (1 + reps/30) : 0;
function records(excluirId){
  const r = {};
  for (const s of S.sesiones){
    if (s.id === excluirId) continue;
    for (const e of (s.ejercicios||[])){
      for (const st of (e.series||[])){
        if (!st.kg || !st.reps) continue;
        const cur = r[e.nombre];
        if (!cur || st.kg > cur.kg || (st.kg === cur.kg && st.reps > cur.reps)) r[e.nombre] = {kg:st.kg, reps:st.reps, fecha:s.fecha, e1:Math.max(e1rm(st.kg,st.reps), cur?cur.e1:0)};
        else if (e1rm(st.kg,st.reps) > cur.e1) cur.e1 = e1rm(st.kg,st.reps);
      }
    }
  }
  return r;
}
const volumen = s => (s.ejercicios||[]).reduce((a,e) => a + (e.series||[]).reduce((b,x) => b + (x.kg||0)*(x.reps||0), 0), 0);
const nSeries = s => (s.ejercicios||[]).reduce((a,e) => a + (e.series||[]).length, 0);

function pitar(){

    [0,0.25,0.5].forEach(t => { const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.frequency.value=880; o.connect(g); g.connect(audioCtx.destination); g.gain.setValueAtTime(0.25, audioCtx.currentTime+t); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+t+0.18); o.start(audioCtx.currentTime+t); o.stop(audioCtx.currentTime+t+0.2); });

function lineChart(series, opt={}){
  const W=340, H=170, L=38, R=10, T=12, B=24;
  const pts = series.flatMap(s => s.pts);
  if (pts.length < 1) return `<div class="empty">Sin datos todavía.</div>`;
  let xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  let x0 = Math.min(...xs), x1 = Math.max(...xs); if (x1===x0){ x0-=86400000*3; x1+=86400000*3; }
  let y0 = Math.min(...ys), y1 = Math.max(...ys);
  const padY = Math.max((y1-y0)*0.15, opt.minPad||1); y0 -= padY; y1 += padY;
  const step = niceStep((y1-y0)/4); y0 = Math.floor(y0/step)*step; y1 = Math.ceil(y1/step)*step;
  const sx = x => L + (x-x0)/(x1-x0)*(W-L-R), sy = y => T + (1-(y-y0)/(y1-y0))*(H-T-B);
  let g = "";
  for (let v=y0; v<=y1+1e-9; v+=step){ g += `<line x1="${L}" x2="${W-R}" y1="${sy(v)}" y2="${sy(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${sy(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmt(v, step<1?1:0)}</text>`; }
  const dl = x => { const d=new Date(x); return `${d.getDate()}/${d.getMonth()+1}`; };
  g += `<text x="${L}" y="${H-6}" font-size="11" fill="var(--muted)">${dl(x0)}</text><text x="${W-R}" y="${H-6}" font-size="11" fill="var(--muted)" text-anchor="end">${dl(x1)}</text>`;
  series.forEach(s => {
    const P = s.pts.slice().sort((a,b) => a.x-b.x);
    if (s.line && P.length > 1){

    <section class="card sec">

  "comido comida comi cene cenado desayune desayunado almorce almorzado merende merendado tome tomado bebi bebido pique picado " +
  "hoy ayer noche manana mediodia tarde casa fuera restaurante bar trabajo gimnasio despues antes entreno entrenar postre segundo primero primer " +
  "otro otra otros otras mas menos solo sola algo bastante tipo como aprox aproximadamente casi entero entera enteros enteras normal mediano mediana " +
  "hasta arriba bien madre padre abuela abuelo suegra novia casero casera caseros caseras hecho hecha hechos hechas acompanado acompanada junto encima " +
  "frito frita fritos fritas asado asada asados asadas plancha horno vapor salteado salteada cocinado cocinada g gr grs gramos ml kg par mucho mucha muchos muchas tambien luego").split(" "));
const SEPARA = w => w === "y" || w === "con" || w === "e";
const CONTABLES = new Set(["ud","filete","trozo","chuleta","loncha","rebanada","muslo","pechuga","rodaja","pieza"]);
const ud1 = w => PORC_SIN[w] || (PORC_DEF[w] ? w : (w.endsWith("es") && PORC_DEF[w.slice(0,-2)]) ? w.slice(0,-2) : (w.endsWith("s") && PORC_DEF[w.slice(0,-1)]) ? w.slice(0,-1) : (PORC_SIN[w.replace(/e?s$/,"")] || null));
let CAT = null, CAT_KEY = "";
function catalogo(){
  const propios = S.alimentos.filter(a => !BASE_IDS.has(a.id));
  const key = propios.map(a => a.id + a.kcal + a.p + a.base + a.unidad).join("|");
  if (CAT && key === CAT_KEY) return CAT;
  const ents = [];
  // Primero tus alimentos (mandan sobre los de la app si se llaman igual)
  propios.forEach(a => {
    const nombre = a.nombre.replace(/\(.*?\)/g, "").trim();
    const porUd = a.unidad === "ud", f = porUd ? 1 : 100 / (a.base || 100);
    ents.push({n:a.nombre, al:[normTxt(nombre), normTxt(a.nombre)], k:a.kcal*f, p:a.p*f, c:a.c*f, g:a.g*f, porUd, u:porUd?"ud":a.unidad,
      por: porUd ? {ud:1} : {racion:100}, def: porUd ? "ud" : "racion", prio:0});
  });
  (window.FITALL_CATALOGO || []).forEach(([n, al, k, p, c, g, por]) => {
    const pr = {}; por.split(",").forEach(x => { const [a, b] = x.split(":"); pr[a] = +b; });
    ents.push({n, al: al.split("|").map(normTxt), k, p, c, g, porUd:false, u: /^(cerveza|vino|cubata|refresco|bebida|zumo|leche|agua|cafe|batido de choc)/i.test(normTxt(n)) ? "ml" : "g",
      por: pr, def: por.split(",")[0].split(":")[0], prio:1, pan: /^Bocadillo \(/.test(n) ? 1 : /^Montadito \(/.test(n) ? 0.4 : 0});
  });
  const alias = [];
  ents.forEach((e, ei) => e.al.forEach(a => { if (a) alias.push({ei, t:a.split(" "), len:a.length}); }));
  CAT = {ents, alias}; CAT_KEY = key; return CAT;
}
const tokIgual = (tok, a) => tok === a || (a.length > 2 && (tok === a + "s" || tok === a + "es" || (a.endsWith("z") && tok === a.slice(0,-1) + "ces")));
const RAC_TXT = {punado:["puñado","puñados"], racion:["ración","raciones"], cana:["caña","cañas"], botellin:["botellín","botellines"], tazon:["tazón","tazones"],
  guarnicion:["guarnición","guarniciones"], porcion:["porción","porciones"], bol:["bol","boles"], ud:["",""], cucharadita:["cucharadita","cucharaditas"],
  chorreon:["chorreón","chorreones"], cuna:["cuña","cuñas"], cacito:["cacito","cacitos"], scoop:["cacito","cacitos"], tapa:["tapa","tapas"]};
function nombreRacion(n, por){
  const t = RAC_TXT[por] || [por, /[aeiou]$/.test(por) ? por + "s" : por + "es"];
  const num = n === 0.5 ? "½" : fmt(n, 2);
  return `${num} ${n > 1 ? t[1] : t[0]}`.trim();
}
function leerCantidad(toks){
  // toks: palabras entre el alimento anterior y este. Devuelve {n, porcion, gramos, mult}
  const r = {n:null, porcion:null, gramos:null, mult:1, varios:false};
  for (let i = toks.length - 1; i >= 0; i--){
    const w = toks[i];
    if (w === "y" || w === "con" || w === "e") break;
    if (["unos","unas","varios","varias","algunos","algunas"].includes(w)){ r.varios = true; continue; }
    const mg = w.match(/^(\d+(?:\.\d+)?)(g|gr|grs|gramos|ml|kg)$/);
    if (mg && r.gramos == null){ r.gramos = +mg[1] * (mg[2] === "kg" ? 1000 : 1); continue; }
    if (/^(g|gr|grs|gramos|ml|kg)$/.test(w) && i > 0 && /^\d+(\.\d+)?$/.test(toks[i-1]) && r.gramos == null){ r.gramos = +toks[i-1] * (w === "kg" ? 1000 : 1); i--; continue; }
    if (r.n == null && /^\d+(\.\d+)?$/.test(w)){ r.n = +w; continue; }
    if (r.n == null && /^\d+\/\d+$/.test(w)){ const [a, b] = w.split("/").map(Number); if (b) r.n = a / b; continue; }
    if (w === "par" && r.n == null){ r.n = 2; if (toks[i-1] === "un") i--; continue; }
    if (NUMS[w] != null){
      if (r.n == null) r.n = NUMS[w];
      else if (w === "medio" || w === "media") r.n += 0.5;  // "dos y medio"
      continue;
    }
    if (GRANDE.has(w)) r.mult = 1.3;
    else if (PEQUE.has(w)) r.mult = 0.7;
    if (w === "arriba" && toks[i-1] === "hasta") r.mult = 1.3;
    const pw = ud1(w); if (pw && !r.porcion) r.porcion = pw;
  }
  return r;
}
function estimarComida(texto){
  const toks = normTxt(texto).split(" ").filter(Boolean);
  const out = {partes:[], noEntiendo:[], total:{kcal:0, p:0, c:0, g:0}};
  if (!toks.length) return out;
  const {ents, alias} = catalogo();
  const cands = [];
  for (let i = 0; i < toks.length; i++)
    for (const a of alias){
      if (i + a.t.length > toks.length) continue;
      let ok = true;
      for (let j = 0; j < a.t.length && ok; j++) ok = tokIgual(toks[i+j], a.t[j]);
      if (ok) cands.push({i, n:a.t.length, len:a.len, ei:a.ei, prio:ents[a.ei].prio, ai:alias.indexOf(a)});
    }
  cands.sort((x, y) => y.n - x.n || y.len - x.len || x.prio - y.prio || x.ei - y.ei || x.i - y.i);
  const usado = new Array(toks.length).fill(false), elegidos = [];
  for (const c of cands){
    let libre = true; for (let j = c.i; j < c.i + c.n; j++) if (usado[j]) libre = false;
    if (!libre) continue;
    for (let j = c.i; j < c.i + c.n; j++) usado[j] = true;
    elegidos.push(c);
  }
  elegidos.sort((x, y) => x.i - y.i);
  // "un tercio de cerveza", "una copa de ron": dos trozos del mismo alimento seguidos son uno solo
  const juntos = [];
  for (const c of elegidos){
    const prev = juntos[juntos.length - 1];
    if (prev && prev.ei === c.ei && toks.slice(prev.i + prev.n, c.i).every(w => w === "de" || w === "del" || w === "la")){
      prev.n = c.i + c.n - prev.i; continue;
    }
    juntos.push(Object.assign({}, c));
  }
  let fin = 0, pan = null;
  juntos.forEach(c => {
    const e = ents[c.ei];
    const prefijo = toks.slice(fin, c.i);
    const q = leerCantidad(prefijo);
    // La cantidad detrás ("pollo 200 g", "pizza dos trozos"), hasta el siguiente "y"/"con"
    if (q.n == null && q.porcion == null && q.gramos == null){
      const tras = [];
      for (let j = c.i + c.n; j < toks.length && !SEPARA(toks[j]) && !usado[j]; j++) tras.push(toks[j]);
      if (tras.length){ const q2 = leerCantidad(tras); if (q2.n != null || q2.porcion || q2.gramos != null) Object.assign(q, q2); }
    }
    // "filetes", "chuletas" sin número: más de uno
    const enPlural = toks.slice(c.i, c.i + c.n).some((w, j) => { const a = alias[c.ai].t[j]; return a && w !== a && w.length > a.length; });
    // La propia forma de decirlo puede llevar la ración: "una caña", "vaso de leche", "lata de atún"
    let porcion = q.porcion && (e.por[q.porcion] || PORC_DEF[q.porcion]) ? q.porcion : null;
    let pluralAlias = false;
    if (!porcion) for (const w of toks.slice(c.i, c.i + c.n)){ const pw = ud1(w); if (pw && e.por[pw]) { porcion = pw; pluralAlias = w !== pw && /s$/.test(w); break; } }
    let n = q.n == null ? 1 : q.n, gramos, txtCant;
    const explicito = q.n != null || q.porcion || q.gramos != null;
    if (e.porUd){
      n = q.n == null ? 1 : q.n; gramos = n;
      txtCant = `${fmt(n,2)} ud`;
    } else if (q.gramos != null){
      gramos = q.gramos; txtCant = `${fmt(gramos)} ${e.u}`;
    } else if (!explicito && pan && e.por.bocadillo){
      gramos = e.por.bocadillo * pan.f * pan.n; txtCant = "en el bocadillo";
    } else {
      let por = porcion || e.def;
      if (q.n == null && !q.porcion){
        if (q.varios && e.por.racion){ por = "racion"; }
        else if ((q.varios || enPlural || pluralAlias) && CONTABLES.has(por)){ n = q.varios || (por === "chuleta" && e.por.chuleta < 60) ? 3 : 2; }
      }
      const g1 = e.por[por] || PORC_DEF[por] || 100;
      gramos = g1 * n * q.mult;
      txtCant = nombreRacion(n, por);
      if (q.mult > 1) txtCant += " grande"; else if (q.mult < 1) txtCant += " pequeño";
    }
    if (e.pan) pan = {f:e.pan, n};
    const f = e.porUd ? gramos : gramos / 100;
    const parte = {nombre:e.n, cant:txtCant, gramos: e.porUd ? null : Math.round(gramos), u:e.u, kcal:e.k*f, p:e.p*f, c:e.c*f, g:e.g*f};
    out.partes.push(parte);
    ["kcal","p","c","g"].forEach(k => out.total[k] += parte[k]);
    fin = c.i + c.n;
  });
  // Palabras que no se han entendido
  let trozo = [];
  const cerrar = () => { if (trozo.length) out.noEntiendo.push(trozo.join(" ")); trozo = []; };
  toks.forEach((w, i) => {
    const ignorar = usado[i] || VACIAS.has(w) || NUMS[w] != null || ud1(w) || GRANDE.has(w) || PEQUE.has(w) || /^\d/.test(w) || w.length < 3;
    if (ignorar) cerrar(); else trozo.push(w);
  });
  cerrar();
  return out;
}

/* ---------- escanear el código de barras (Open Food Facts) ---------- */
const scan = {el:null, stream:null, ctrl:null, timer:null, vivo:false, prod:null, code:""};
const eanValido = c => {
  if (!/^\d{8}$|^\d{12,14}$/.test(c)) return false;
  const d = c.split("").map(Number), chk = d.pop();
  const s = d.reverse().reduce((a, x, i) => a + x * (i % 2 === 0 ? 3 : 1), 0);
  return (10 - s % 10) % 10 === chk;
};
function scanPintar(html){ if (scan.el) scan.el.querySelector(".scan-body").innerHTML = html; }
function abrirEscaner(){
  if (!scan.el){
    scan.el = document.createElement("div");
    scan.el.className = "scan"; scan.el.setAttribute("role", "dialog"); scan.el.setAttribute("aria-label", "Escanear código de barras");
    scan.el.innerHTML = `<div class="scan-in"><div class="row between"><span class="eyebrow">Escanear producto</span><button class="iconbtn" data-sc="cerrar" aria-label="Cerrar">✕</button></div><div class="scan-body"></div></div>`;
    document.body.appendChild(scan.el);
    scan.el.addEventListener("click", scanClick);
    scan.el.addEventListener("input", scanInput);
    scan.el.addEventListener("submit", scanSubmit);
  }
  scan.el.hidden = false; document.body.classList.add("scan-abierto");
  scan.prod = null; scan.code = "";
  pantallaCamara();
}
function cerrarEscaner(){ pararCamara(); if (scan.el) scan.el.hidden = true; document.body.classList.remove("scan-abierto"); }
function pararCamara(){
  scan.vivo = false; clearTimeout(scan.timer);
  try { scan.ctrl && scan.ctrl.stop(); } catch(e){}
  scan.ctrl = null;
  if (scan.stream){ scan.stream.getTracks().forEach(t => t.stop()); scan.stream = null; }
}
function cargarScript(src){
  return new Promise((ok, mal) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => mal(new Error("No se pudo cargar " + src)); document.head.appendChild(s); });
}
async function pantallaCamara(){
  scanPintar(`<div class="scan-video"><video id="sc-video" playsinline muted autoplay></video><div class="scan-guia"></div></div>
    <span class="small muted" id="sc-msg">Apunta al código de barras del envase y mantén el móvil quieto.</span>
    <form class="row" data-sc-form="codigo">
      <label class="fld grow"><input id="sc-num" name="codigo" inputmode="numeric" placeholder="O escribe el número" aria-label="Número del código de barras" autocomplete="off"></label>
      <button class="btn" type="submit">Buscar</button>
    </form>`);
  const video = $("#sc-video"), msg = $("#sc-msg");
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ msg.textContent = "Este navegador no deja usar la cámara. Escribe el número que hay debajo de las barras."; return; }
  scan.vivo = true;
  const visto = c => { if (!scan.vivo || !eanValido(c)) return false; pararCamara(); if (navigator.vibrate) navigator.vibrate(60); buscarProducto(c); return true; };
  try {
    let detector = null;
    if ("BarcodeDetector" in window){
      try { const f = await BarcodeDetector.getSupportedFormats(); if (f.includes("ean_13")) detector = new BarcodeDetector({formats: f.filter(x => /ean|upc/.test(x))}); } catch(e){}
    }
    if (detector){
      scan.stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}, width:{ideal:1280}}, audio:false});
      if (!scan.vivo){ pararCamara(); return; }
      video.srcObject = scan.stream; await video.play().catch(() => {});
      const bucle = async () => {
        if (!scan.vivo) return;
        try { const r = await detector.detect(video); for (const b of r) if (visto(b.rawValue)) return; } catch(e){}
        scan.timer = setTimeout(bucle, 180);
      };
      bucle();
    } else {
      if (!window.ZXingBrowser) await cargarScript("vendor/zxing-browser.min.js");
      if (!scan.vivo) return;
      const lector = new ZXingBrowser.BrowserMultiFormatReader();
      scan.ctrl = await lector.decodeFromConstraints({video:{facingMode:{ideal:"environment"}}, audio:false}, video, (res) => { if (res) visto(res.getText()); });
      if (!scan.vivo) pararCamara();
    }
  } catch(e){
    pararCamara();
    msg.innerHTML = e && (e.name === "NotAllowedError" || e.name === "SecurityError")
      ? "FIT-ALL no tiene permiso para usar la cámara. Dáselo en los ajustes del navegador o escribe el número del código de barras."
      : "No se ha podido abrir la cámara. Escribe el número que hay debajo de las barras.";
  }
}
async function buscarProducto(code){
  scan.code = code;
  // Primero en tus alimentos (sirve sin internet)
  const propio = S.alimentos.find(a => a.ean === code);
  if (propio){ scan.prod = {nombre:propio.nombre, marca:"", k:propio.kcal, p:propio.p, c:propio.c, g:propio.g, u:propio.unidad === "ml" ? "ml" : "g", racion:propio.racion||null, paquete:propio.paquete||null, guardado:propio.id}; return pantallaProducto(); }
  scanPintar(`<div class="empty">Buscando el producto ${esc(code)}…</div>`);
  const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 12000);
  try {
    const url = `https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=product_name,product_name_es,generic_name_es,brands,quantity,product_quantity,product_quantity_unit,serving_quantity,nutriments,image_front_small_url`;
    const r = await fetch(url, {signal: ctl.signal}); clearTimeout(to);
    const j = r.ok ? await r.json() : null;
    const pr = j && j.status === 1 && j.product;
    const n = pr && pr.nutriments || {};
    const kcal = n["energy-kcal_100g"] != null ? +n["energy-kcal_100g"] : (n["energy_100g"] != null ? +n["energy_100g"] / 4.184 : null);
    const nombre = pr ? (pr.product_name_es || pr.product_name || pr.generic_name_es || "").trim() : "";
    if (!pr || kcal == null || isNaN(kcal)){ return pantallaEtiqueta(nombre ? "Está en la base de datos, pero sin la información nutricional." : "Este producto no está en la base de datos.", nombre); }
    const unidad = /ml|cl|l/i.test(pr.product_quantity_unit || "") ? "ml" : "g";
    scan.prod = {nombre: nombre || "Producto " + code, marca: (pr.brands || "").split(",")[0].trim(), img: pr.image_front_small_url || "",
      k: kcal, p: +n.proteins_100g || 0, c: +n.carbohydrates_100g || 0, g: +n.fat_100g || 0, u: unidad,
      racion: +pr.serving_quantity > 0 ? +pr.serving_quantity : null, paquete: +pr.product_quantity > 0 ? +pr.product_quantity : null};
    pantallaProducto();
  } catch(e){
    clearTimeout(to);
    pantallaEtiqueta(navigator.onLine === false || (e && e.name === "AbortError") ? "Sin internet no puedo buscar el producto." : "No he podido buscar el producto ahora mismo.", "");
  }
}

function scanClick(e){
  const b = e.target.closest("[data-sc]"); if (!b) return;

const durMin = t => { const m = String(t||"").match(/(\d+)/); return m ? Math.min(180, +m[1]) : 60; };
function resumenUltimo(s){
  const out = [];
  for (const e of (s.ejercicios||[])){
    if (out.length >= 3) break;
    if ((e.modo||"kg") !== "kg") continue;
    const u = ultima(e.nombre);
    if (!u) continue;
    const v = u.series.filter(x => x.kg); if (!v.length) continue;
    const mx = Math.max(...v.map(x => x.kg)); const r = Math.max(...v.filter(x => x.kg===mx).map(x => x.reps||0));
    out.push(`${e.nombre}: ${fmt(mx,2)} kg × ${r}`);
  }

}
function eventosRecordatorio(r, desde, dias){
  const ev = [], ahora = new Date();
  for (let k = 0; k < dias; k++){
    const f = addDias(desde, k), dow = parseISO(f).getDay();
    const fz = fase(f);
    const push = (hora, minutos, titulo, texto, tipo) => {
      if (!/^\d{1,2}:\d{2}$/.test(hora||"")) return;
      const [h, m] = hora.split(":").map(Number);
      const ini = parseISO(f); ini.setHours(h, m, 0, 0);
      if (ini <= ahora) return;
      ev.push({ini, fin: new Date(ini.getTime() + minutos*60000), titulo, texto, uid:`${f}-${tipo}-${slug(titulo).slice(0,30)}@fit-all`});
    };
    if (r.pesarOn && r.pesarDias.includes(dow)) push(r.pesar, 5, "Pésate en ayunas", frase("pesar", f) + "\n\nApúntalo en FIT-ALL (pantalla Hoy).", "pesar");
    if (r.entrenoOn){
      for (const s of sesionesDeDia(f)){
        if (fz && fz.ajuste === "descarga" && /hiit/i.test(s.nombre)) continue;
        const lineas = [frase("entreno", f, s.nombre), ""];
        if (fz && !fz.fuera) lineas.push(`Semana ${fz.semana} · ${fz.nombre}: ${fz.rir}. ${fz.series}.`, "");
        lineas.push("Hoy toca:", ...(s.ejercicios||[]).map(e => `· ${e.nombre} — ${e.objetivo}`));
        const ult = resumenUltimo(s);
        if (ult.length) lineas.push("", "Última vez:", ...ult.map(x => "· " + x));
        push(horaSesion(s, r), durMin(s.duracion), `Entreno · ${s.nombre}`, lineas.join("\n"), "entreno");
      }
    }
    if (r.comidasOn){
      for (const c of comidas()){
        const hora = r.horas[c]; if (!hora) continue;
        let txt = "Come lo que haya en casa y apúntalo en FIT-ALL: todo, también el pan, el aceite y la bebida.";
        if (tipoComida(c) === "comida" || tipoComida(c) === "cena") txt += "\nQue lleve una ración de carne, pescado, huevos o legumbre del tamaño de tu mano.";

  }

}
function icsTexto(ev){
  const esc2 = s => String(s).replace(/\\/g, "\\\\").replace(/;/g, "\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
  const p2 = n => String(n).padStart(2, "0");
  const loc = d => `${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}T${p2(d.getHours())}${p2(d.getMinutes())}00`;
  const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
  const enc = new TextEncoder();
  const plegar = linea => {
    const out = []; let cur = "", n = 0;
    for (const ch of linea){ const b = enc.encode(ch).length; if (n + b > (out.length ? 73 : 74)){ out.push(cur); cur = ""; n = 0; } cur += ch; n += b; }
    out.push(cur); return out.join("\r\n ");
  };
  const L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//FIT-ALL//Recordatorios//ES","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:FIT-ALL"];
  ev.forEach(e => {
    L.push("BEGIN:VEVENT", `UID:${e.uid}`, `DTSTAMP:${stamp}`, `DTSTART:${loc(e.ini)}`, `DTEND:${loc(e.fin)}`, `SUMMARY:${esc2(e.titulo)}`, `DESCRIPTION:${esc2(e.texto)}`,
      "BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${esc2(e.titulo)}`, "TRIGGER:PT0S", "END:VALARM", "END:VEVENT");
  });
  L.push("END:VCALENDAR");
  return L.map(plegar).join("\r\n") + "\r\n";
}
async function crearRecordatorios(modo){
  const r = S.cfgEd && S.cfgEd.recordatorios ? normRec(S.cfgEd.recordatorios) : rec();

  if (!ev.length){ toast("No hay recordatorios que crear: activa alguno y pon las horas."); return; }
  const data = icsTexto(ev), nombre = "fit-all-recordatorios.ics";
  let file = null; try { file = new File([data], nombre, {type:"text/calendar"}); } catch(e) {}

    try { if (file && navigator.canShare && navigator.canShare({files:[file]})) { await navigator.share({files:[file], title:"Recordatorios de FIT-ALL"}); lsSet("fitall_cal_hasta", addDias(hoyISO(), (r.semanas||2)*7)); render(); return; } }
    catch(e){ if (e && e.name === "AbortError") return; }

  const url = URL.createObjectURL(file || new Blob([data], {type:"text/calendar"}));
  const a = document.createElement("a"); a.href = url; a.download = nombre; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 3000);
  lsSet("fitall_cal_hasta", addDias(hoyISO(), (r.semanas||2)*7)); render();
  toast(`${ev.length} recordatorios listos. Pulsa «Añadir todo» en el calendario.`);

// Series por músculo entre dos fechas: la principal cuenta 1, la secundaria ½.
function seriesPorMusculo(desde, hasta){
  const r = {}, ej = {}, sin = new Set();
  for (const s of S.sesiones){
    if (s.fecha < desde || s.fecha > hasta) continue;
    for (const e of (s.ejercicios||[])){
      const n = (e.series||[]).filter(x => x.reps != null || x.kg != null).length;
      if (!n) continue;
      const lib = bibEj(e.nombre);
      if (!lib){ sin.add(e.nombre); continue; }
      if (lib.m === "cardio") continue;
      const suma = (m, v) => { r[m] = (r[m]||0) + v; ej[m] = ej[m] || {}; ej[m][e.nombre] = (ej[m][e.nombre]||0) + v; };
      (lib.p||[]).forEach(m => suma(m, n));
      (lib.s||[]).forEach(m => suma(m, n/2));
    }
  }
  return {r, ej, sin:[...sin]};
}

function fuerzaPorMusculo(){
  const desde = addDias(hoyISO(), -42), porEj = {};
  S.sesiones.slice().sort((a,b) => a.fecha < b.fecha ? -1 : 1).forEach(s => {
    if (s.fecha < desde) return;
    (s.ejercicios||[]).forEach(e => {
      const v = (e.series||[]).filter(x => x.kg && x.reps); if (!v.length) return;
      (porEj[e.nombre] = porEj[e.nombre] || []).push({f:s.fecha, v:Math.max(...v.map(x => e1rm(x.kg, x.reps)))});
    });
  });
  const r = {};
  for (const [n, L] of Object.entries(porEj)){
    if (L.length < 2) continue;
    const lib = bibEj(n); if (!lib) continue;
    const ini = L[0], fin = L[L.length-1], pct = (fin.v - ini.v) / ini.v * 100;
    (lib.p||[]).forEach(m => (r[m] = r[m] || []).push({n, ini, fin, pct}));
  }
  return r;

/* ---------- progresión automática: qué toca hoy en cada ejercicio ---------- */
// Progresión doble: mismo peso hasta completar el máximo de repeticiones en todas las series; entonces se sube
// (1-2,5 kg en tren superior, 2,5-5 kg en tren inferior) y se vuelve al mínimo. La fase del ciclo ajusta series y esfuerzo.
const INFERIOR = ["cuadriceps","gluteo","femoral","aductor","abductor","gemelo"];
const PIERNA_PESADA = ["sentadilla","prensa","peso-muerto","peso-muerto-rumano","hip-thrust"];
function rangoReps(objetivo){
  const m = String(objetivo||"").match(/×\s*(\d+)(?:\s*-\s*(\d+))?/);
  return m ? {lo:+m[1], hi:+(m[2]||m[1])} : null;
}
function incremento(nombre, W, modo){
  if (modo === "corporal") return 2.5;
  const lib = bibEj(nombre);
  if (lib && (lib.e === "Mancuernas" || lib.e === "Kettlebell")) return W < 10 ? 1 : (W % 2.5 === 0 ? 2.5 : 2);
  if (lib ? PIERNA_PESADA.includes(lib.f) : /sentadilla|prensa|peso muerto|hip thrust/i.test(nombre)) return 5;
  if (lib && (lib.p||[]).some(m => INFERIOR.includes(m))) return 2.5;
  return 2.5;
}
// Última sesión anterior con ese ejercicio; las de semanas de descarga no sirven de referencia si hay otra.
function referencia(nombre, fecha){
  let reserva = null;
  for (const s of S.sesiones){
    if (s.fecha >= fecha) continue;
    const e = (s.ejercicios||[]).find(x => x.nombre === nombre);
    if (!e) continue;
    const series = (e.series||[]).filter(x => x.reps != null || x.kg != null);
    if (!series.length) continue;
    const r = {fecha:s.fecha, series, rir:e.rir};
    const fz = fase(s.fecha);
    if (fz && !fz.fuera && fz.ajuste === "descarga"){ reserva = reserva || r; continue; }
    return r;
  }
  return reserva;
}
function objetivoHoy(e, fecha){
  const n = Math.max(1, (e.series||[]).length);
  const fz = fase(fecha);
  const fs = !fz || fz.fuera ? "normal" : fz.ajuste === "descarga" ? "descarga" : fz.ajuste === "menos1" ? "adapt" : "normal";
  const r = rangoReps(e.objetivo), lo = r ? r.lo : null, hi = r ? r.hi : null;
  const ref = referencia(e.nombre, fecha);
  const out = {tipo:"", fase:fs, ref, series:[], kg:null, W:null, lo, hi};
  const lista = f => Array.from({length:n}, (_, i) => f(i));
  if (!ref){
    out.tipo = "primera"; out.series = lista(() => ({kg:null, reps:lo})); return out;
  }
  const ser = ref.series, de = i => ser[Math.min(i, ser.length - 1)];
  if (e.modo === "cardio"){
    out.tipo = "cardio"; out.series = lista(i => ({kg:null, reps:de(i).reps})); return out;
  }
  if (e.modo === "tiempo"){
    const todas = hi != null && ser.every(s => (s.reps||0) >= hi);
    out.tipo = fs === "descarga" ? "descarga" : todas ? "subir" : "mantener";
    out.series = lista(i => { const b = de(i).reps || 0;
      return {kg:null, reps: fs === "descarga" ? (lo || b) : todas ? b + 5 : (hi != null ? Math.max(lo, Math.min(hi, b + 5)) : b + 5)}; });
    return out;
  }
  // kg y peso corporal (+lastre)
  const W = Math.max(0, ...ser.map(s => s.kg || 0));
  const enW = ser.filter(s => (s.kg || 0) === W);
  // las series más ligeras de aproximación no cuentan: basta con que todas las del peso de trabajo lleguen al máximo
  const todasTop = hi != null && enW.length >= Math.min(2, ser.length) && enW.every(s => (s.reps||0) >= hi);
  const malas = lo != null ? enW.filter(s => (s.reps||0) < lo).length : 0;
  const flojo = lo != null && malas > enW.length / 2 && enW.some(s => (s.reps||0) <= lo - 2);
  const inc = incremento(e.nombre, W, e.modo);
  const repsUlt = i => de(i).reps || 0;
  let kg = W, reps;
  if (fs === "descarga"){
    out.tipo = "descarga";
    const paso = W < 10 ? 1 : 2.5;
    kg = e.modo === "corporal" ? W : Math.max(paso, Math.floor(W * 0.9 / paso) * paso);
    reps = i => lo != null ? lo : repsUlt(i);
  } else if (todasTop){
    out.tipo = "subir"; kg = W + inc; reps = () => lo;
  } else if (flojo){
    out.tipo = "bajar"; kg = Math.max(0, W - inc); reps = () => lo;
  } else if (fs === "adapt"){
    out.tipo = "adapt"; reps = i => lo != null ? lo : repsUlt(i);
  } else {
    out.tipo = "mantener";
    reps = i => hi != null ? Math.max(lo, Math.min(hi, repsUlt(i) + 1)) : repsUlt(i);
  }
  out.W = W; out.kg = (e.modo === "kg" && !W) ? null : kg; out.inc = inc;
  out.series = lista(i => ({kg: (e.modo === "kg" && !W) ? null : kg, reps: reps(i)}));
  return out;
}
function objetivoHTML(e, o){

  const reps = o.series.map(s => s.reps);

  else if (o.tipo === "bajar"){ cls = "down"; por = `La última vez te quedaste lejos de ${o.lo} reps con ${W}: baja un poco, haz ${o.lo} bien y vuelve a subir.`; }
  else if (o.tipo === "descarga") por = `Semana de descarga: ${e.modo === "kg" && o.W ? "algo menos de peso (≈10 %), " : ""}menos series y que te sobren 3-4 reps.`;

  else if (o.hi != null) por = e.modo === "tiempo" ? `Intenta 5 s más que la última vez, hasta ${o.hi} s.` : `Mismo peso: intenta una rep más que la última vez, hasta llegar a ${o.hi} en todas las series.`;
  else por = "Repite lo de la última vez.";
  return `<div class="hint obj ${cls}"><b>Hoy toca: ${esc(cab)}</b><span>${esc(por + sinKg)}</span></div>${ult}`;

/* ---------- pasos ---------- */
const pesoActual = () => { const m = S.medidas.filter(x => x.peso); return m.length ? m[m.length - 1].peso : 75; };
const kcalPasos = p => Math.round((p || 0) * pesoActual() * 0.0005);
function gastoDia(f){
  const o = obj(), peso = pesoActual();
  const reposo = 10 * peso + 6.25 * (num(o.altura) || 170) - 5 * (num(o.edad) || 28) + (o.sexo === "mujer" ? -161 : 5);
  const base = Math.round(reposo * 1.2);
  const pasos = (S.diario[f] || {}).pasos || 0, andar = kcalPasos(pasos);
  let entreno = 0;
  S.sesiones.filter(s => s.fecha === f).forEach(s => (s.ejercicios||[]).forEach(e => {
    if (e.modo === "cardio") entreno += (e.series||[]).reduce((a, x) => a + (x.reps || 0), 0) * 7;
    else entreno += (e.series||[]).length * 8;
  }));
  entreno = Math.round(entreno);
  return {base, andar, entreno, total: base + andar + entreno, pasos};
}
const mil = n => String(Math.round(n || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ".");

/* ---------- sincronización entre móviles (a través de tu hoja de Google) ---------- */
const SY = {corriendo:false, otra:false};
const syncCfg = () => lsGet("fitall_sync") || {};
const syncOn = () => !!syncCfg().on;
const syncUrl = () => hojaUrl() || syncCfg().url;
const pendSync = () => lsGet("fitall_sync_pend") || {};
const setSync = o => lsSet("fitall_sync", Object.assign(syncCfg(), o));
function marcarSync(paths){
  if (!syncOn()) return;
  const p = pendSync(), t = Date.now();
  paths.forEach(x => { p[x] = t; });
  lsSet("fitall_sync_pend", p);
  clearTimeout(marcarSync.t); marcarSync.t = setTimeout(() => sincronizar(), 2500);
}
const postSync = async (url, cuerpo) => {
  const r = await fetch(url, {method:"POST", body:JSON.stringify(cuerpo), headers:{"Content-Type":"text/plain;charset=utf-8"}});
  const j = await r.json();
  if (!j.ok) throw new Error(j.error === "clave" ? "clave" : (j.error || "error"));
  if (j.seq == null) throw new Error("antiguo");
  return j;
};
const errSyncTxt = m => m === "clave" ? "Tu hoja no reconoce este móvil. Vuelve a conectarlo con el código de tu otro móvil."
  : m === "antiguo" ? "Tu hoja tiene el código antiguo. Actualízalo (mira «Tus móviles» en Ajustes)."
  : "No pude sincronizar. Lo reintento sola cuando haya conexión.";
async function sincronizar(manual){
  const url = syncUrl();
  if (!syncOn() || !url) return;
  if (SY.corriendo){ SY.otra = true; return; }
  if (!navigator.onLine){ if (manual) toast("Sin conexión: lo sincronizo cuando vuelva."); return; }
  SY.corriendo = true;
  try {
    const pend = pendSync();
    const mapa = new Map((await leerTodo()).map(d => [d.path, d.data]));
    const cambios = Object.entries(pend).map(([path, t]) => ({path, t, data: mapa.has(path) ? mapa.get(path) : null}));
    const j = await postSync(url, {clave:claveHoja(), accion:"sync", desde:syncCfg().seq || 0, cambios});
    const ahora = pendSync();
    cambios.forEach(c => { if (ahora[c.path] === c.t) delete ahora[c.path]; });
    lsSet("fitall_sync_pend", ahora);
    const enviados = new Map(cambios.map(c => [c.path, c.t]));
    const ops = [];
    (j.docs || []).forEach(d => {
      if (enviados.get(d.path) === d.t) return;              // es lo que acabo de subir yo
      if (ahora[d.path] && ahora[d.path] >= d.t) return;     // aquí hay un cambio más nuevo sin subir
      ops.push([d.path, d.data]);
    });
    if (ops.length){ await escribirVarios(ops); repartir(await leerTodo()); pedirRender(); }
    setSync({seq:j.seq, ok:new Date().toISOString(), err:null});
    if (manual) toast(ops.length ? `Sincronizado: ${ops.length} cambio${ops.length > 1 ? "s" : ""} de tu otro móvil.` : "Todo al día en tus móviles.");
    else if (ops.length) toast("Datos actualizados desde tu otro móvil");
    if (S.tab === "ajustes") pedirRender();
  } catch(e){
    setSync({err:String(e && e.message || e), errCuando:new Date().toISOString()});
    if (manual) toast(errSyncTxt(String(e && e.message)));
    if (S.tab === "ajustes") pedirRender();
  } finally {
    SY.corriendo = false;
    if (SY.otra){ SY.otra = false; setTimeout(() => sincronizar(), 400); }
  }
}

const b64url = s => btoa(unescape(encodeURIComponent(s))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const deB64url = s => decodeURIComponent(escape(atob(s.replace(/-/g, "+").replace(/_/g, "/"))));
const enlaceMovil = () => `${location.origin}${location.pathname}#enlazar=${b64url(JSON.stringify({u:syncUrl(), k:claveHoja()}))}`;
function leerCodigo(txt){
  const m = String(txt || "").match(/enlazar=([A-Za-z0-9_-]+)/) || String(txt || "").trim().match(/^([A-Za-z0-9_-]{20,})$/);
  if (!m) return null;
  try { const c = JSON.parse(deB64url(m[1])); return c && /^https:\/\/script\.google(usercontent)?\.com\//.test(c.u) && c.k ? c : null; } catch(e){ return null; }
}
async function enlazar(c){
  if (!navigator.onLine){ toast("Necesitas conexión a internet para conectar los móviles."); return; }
  toast("Conectando con tu otro móvil…");
  try {
    const j = await postSync(c.u, {clave:c.k, accion:"sync", desde:0, cambios:[]});
    const ops = (j.docs || []).filter(d => d.data != null).map(d => [d.path, d.data]);
    if (!ops.length){ toast("Tu otro móvil aún no ha subido sus datos. En él, ve a Ajustes → Tus móviles → «Activar en este móvil»."); return; }
    lsSet("fitall_clave", c.k);
    lsSet("fitall_sync_pend", {});
    lsSet("fitall_sync", {on:true, url:c.u, seq:j.seq, ok:new Date().toISOString()});
    await escribirVarios(ops, true);
    repartir(await leerTodo());
    S.enlacePend = null; S.cfgEd = null; S.cfgDirty = false; S.rutEd = null; S.ed = null; S.entEd = null;
    S.tab = "hoy"; render(); window.scrollTo(0,0);
    toast(`¡Conectado! Ya tienes aquí todo lo de tu otro móvil.`);
  } catch(e){ toast(errSyncTxt(String(e && e.message))); }
}

  else if (a === "importar") $("#imp-file").click();
  else if (a === "importOk" && S.importPend) aplicarCopia(S.importPend);
  else if (a === "importCancelar"){ S.importPend = null; render(); }
  else if (a === "crearRutina"){ S.tab = "ajustes"; S.rutEd = clone(ordenPlan(S.plan||[])); render(); const r = $("[data-act=\"rutAddSes\"]"); if (r) r.scrollIntoView({block:"center"}); }
  else if (a === "ocultarInstalar"){ lsSet("fitall_ocultar_instalar", true); render(); }
  else if (a === "instalar" && promptInstalar){ promptInstalar.prompt(); try { await promptInstalar.userChoice; } catch(e) {} promptInstalar = null; render(); }
  // rutina
  else if (a === "rutEditar"){ S.rutEd = clone(ordenPlan(S.plan||[])); S.borrarArm = null; render(); }
  else if (a === "rutCancelar"){ S.rutEd = null; S.borrarArm = null; render(); }
  else if (a === "rutGuardar") guardarRutina();
  else if (a === "rutAddSes"){
    const n = Math.max(0, ...S.rutEd.map(s => s.n||0), ...(S.plan||[]).map(s => s.n||0), ...S.sesiones.filter(s => s.n < 100).map(s => s.n||0)) + 1;
    S.rutEd.push({n, dia:"Lunes", turno:"Tarde", nombre:"", tipo:"Fuerza", duracion:"", ejercicios:[{nombre:"", objetivo:"3 × 8-10", descanso:"90 s", modo:"kg", nuevo:true}]});
    render(); const el = $(`#rs-n-${S.rutEd.length-1}`); if (el) { el.scrollIntoView({block:"center"}); el.focus(); }
  }
  else if (a === "rutDelSes"){
    const si = +b.dataset.si;
    if (S.borrarArm !== "ses"+si){ S.borrarArm = "ses"+si; render(); return; }
    S.borrarArm = null; S.rutEd.splice(si, 1); render();
  }
  else if (a === "rutAddEj"){
    const si = +b.dataset.si; S.rutEd[si].ejercicios = S.rutEd[si].ejercicios || [];
    S.rutEd[si].ejercicios.push({nombre:"", objetivo:"3 × 10-12", descanso:"90 s", modo:"kg", nuevo:true});
    render(); const el = $(`#re-n-${si}-${S.rutEd[si].ejercicios.length-1}`); if (el) el.focus();
  }
  else if (a === "rutDelEj"){ S.rutEd[+b.dataset.si].ejercicios.splice(+b.dataset.ei, 1); render(); }
  else if (a === "rutMoveEj"){
    const L = S.rutEd[+b.dataset.si].ejercicios, i = +b.dataset.ei, j = i + (+b.dataset.d);
    if (j >= 0 && j < L.length){ [L[i], L[j]] = [L[j], L[i]]; render(); }
  }
  // ajustes
  else if (a === "cfgGuardar") guardarCfg();
  else if (a === "escanear") abrirEscaner();
  else if (a === "aguaSet"){
    const f = b.dataset.f, vaso = Math.max(50, num(obj().vasoMl) || 250), n = +b.dataset.n;
    const llenos = Math.round(((S.diario[f] || {}).agua || 0) / vaso);
    guardarAgua(f, (n === llenos ? n - 1 : n) * vaso);
  }
  else if (a === "aguaMas"){
    const f = b.dataset.f, vaso = Math.max(50, num(obj().vasoMl) || 250);
    guardarAgua(f, ((S.diario[f] || {}).agua || 0) + (+b.dataset.d) * vaso);
  }
  else if (a === "recDia" && S.cfgEd){ const r = S.cfgEd.recordatorios, d = +b.dataset.d; r.pesarDias = r.pesarDias.map(Number).includes(d) ? r.pesarDias.map(Number).filter(x => x !== d) : r.pesarDias.map(Number).concat([d]); S.cfgDirty = true; render(); }
  else if (a === "recCrear"){ if (S.cfgDirty) await guardarCfg(); crearRecordatorios("descargar"); }
  else if (a === "recCompartir"){ if (S.cfgDirty) await guardarCfg(); crearRecordatorios("compartir"); }
  else if (a === "cfgReset"){ S.cfgEd = null; S.cfgDirty = false; render(); }
  else if (a === "kcalDeMacros" && S.cfgEd){ const o = S.cfgEd; o.kcal = String(Math.round((num(o.p)||0)*4+(num(o.c)||0)*4+(num(o.g)||0)*9)); S.cfgDirty = true; render(); }
  else if (a === "cfgAdd" && S.cfgEd){
    const l = b.dataset.l;
    if (l === "fases") S.cfgEd.ciclo.fases.push({nombre:"Nueva semana", rir:"2 reps de margen", series:"Las series indicadas", ajuste:"igual"});
    if (l === "suples") S.cfgEd.suples.push({k:"", nombre:"", det:""});
    if (l === "comidas") S.cfgEd.comidas.push("");
    S.cfgDirty = true; render();
  }
  else if (a === "cfgDel" && S.cfgEd){
    const l = b.dataset.l, i = +b.dataset.i;
    (l === "fases" ? S.cfgEd.ciclo.fases : S.cfgEd[l]).splice(i, 1);
    S.cfgDirty = true; render();
  }
  else if (a === "cfgMove" && S.cfgEd){
    const L = S.cfgEd[b.dataset.l], i = +b.dataset.i, j = i + (+b.dataset.d);
    if (j >= 0 && j < L.length){ [L[i], L[j]] = [L[j], L[i]]; S.cfgDirty = true; render(); }
  }
  // registros
  else if (a === "exQuitar" && S.ed){ S.ed.ejercicios.splice(+b.dataset.e, 1); S.exCambio = null; guardarBorrador(); render(); }
  else if (a === "exCambiar" && S.ed){
    const i = +b.dataset.e, lib = bibEj(S.ed.ejercicios[i].nombre);
    abrirBib({modo:"elegir", multi:false, destino:{tipo:"edCambio", i}, mus: lib && lib.p && lib.p[0] ? grupoDe(lib.p[0]) : (lib && lib.m === "cardio" ? "Cardio" : "")});
  }
  else if (a === "exCambioOk" && S.ed){
    const v = ($("#ex-cambio")?.value || "").trim(); if (!v) { toast("Escribe el nombre del ejercicio."); return; }
    const e = S.ed.ejercicios[S.exCambio]; e.nombre = v; e.modo = modoDe(v); S.exCambio = null; guardarBorrador(); render();
  }
  else if (a === "exAnadir" && S.ed){
    const v = ($("#ex-nuevo")?.value || "").trim(); if (!v) { toast("Escribe el nombre del ejercicio que quieres añadir."); return; }
    S.ed.ejercicios.push({nombre:v, modo:modoDe(v), objetivo:"", descanso:"90 s", series:[{kg:"",reps:"",ok:false}], rir:"", notas:""});
    guardarBorrador(); render();
  }
  else if (a === "alEditar"){ S.alEdit = b.dataset.id; render(); const el = $("#na-nombre"); if (el) { el.scrollIntoView({block:"center"}); el.focus(); } }
  else if (a === "alCancelar"){ S.alEdit = null; render(); }
  else if (a === "itemEditar"){ S.itemEdit = b.dataset.id; render(); }
  else if (a === "itemCancelar"){ S.itemEdit = null; render(); }
  else if (a === "medEditar"){ S.medEdit = b.dataset.id; render(); const el = $("#md-peso"); if (el) { el.scrollIntoView({block:"center"}); el.focus(); } }
  else if (a === "medCancelar"){ S.medEdit = null; render(); }
});
view.addEventListener("submit", async e => {
  const fm = e.target.closest("form[data-form]"); if (!fm) return;
  e.preventDefault();
  const fd = Object.fromEntries(new FormData(fm).entries());
  const k = fm.dataset.form;
  if (k === "pesoHoy"){
    const p = num(fd.peso); if (p==null || p<30 || p>250){ toast("Escribe el peso en kg, por ejemplo 75,4."); return; }
    const f = hoyISO(); const prev = S.medidas.find(m => m.fecha===f) || {};
    const doc = Object.assign({}, prev, {fecha:f, peso:p}); delete doc.id;
    S.medidas = S.medidas.filter(m => m.fecha!==f).concat([Object.assign({id:f}, doc)]).sort((a,b) => a.fecha<b.fecha?-1:1);
    render(); await escribir("medidas/"+f, doc); hojaMedidas(f); toast("Peso guardado");
  }
  else if (k === "enlazar"){
    const c = leerCodigo(fd.codigo);
    if (!c){ toast("Ese código no es válido. Cópialo entero desde tu otro móvil."); return; }
    S.enlacePend = c; render(); window.scrollTo(0,0);
  }
  else if (k === "pasos"){
    const f = fm.dataset.f, v = num(String(fd.pasos || "").replace(/\./g, ""));
    if (v == null || v < 0 || v > 100000){ toast("Escribe los pasos con números, por ejemplo 8500."); return; }
    const d = Object.assign({fecha:f, items:[]}, S.diario[f] || {}); d.pasos = Math.round(v);
    await guardarDia(f, d);
    const meta = num(obj().pasos) || 10000;
    toast(v >= meta ? `¡${mil(v)} pasos! Meta cumplida` : `Pasos guardados: ≈ ${fmt(kcalPasos(v))} kcal andando`);
  }
  else if (k === "addMedida"){
    const f = fd.fecha || hoyISO(); const p = num(fd.peso), c = num(fd.cintura);
    if (p==null && c==null){ toast("Escribe el peso, la cintura o las dos."); return; }
    const editando = S.medEdit;
    let doc;
    if (editando){ doc = {fecha:f}; if (p!=null) doc.peso = p; if (c!=null) doc.cintura = c; }
    else { const prev = S.medidas.find(m => m.fecha===f) || {}; doc = Object.assign({}, prev, {fecha:f}); delete doc.id; if (p!=null) doc.peso = p; if (c!=null) doc.cintura = c; }
    S.medidas = S.medidas.filter(m => m.fecha!==f && m.id!==editando).concat([Object.assign({id:f}, doc)]).sort((a,b) => a.fecha<b.fecha?-1:1);
    S.medEdit = null; render();
    await escribir("medidas/"+f, doc);
    if (editando && editando !== f){ await borrarDoc("medidas/"+editando); hojaMedidas(editando); }
    hojaMedidas(f);
    toast(editando ? "Medida actualizada" : "Medida guardada");
  }
  else if (k === "addItem"){
    const texto = (fd.nombre || "").trim().replace(/\s+/g, " ");
    if (!texto){ toast("Escribe qué has comido."); return; }
    S.ultComida = fd.comida;
    const f = S.dietaFecha; const d = Object.assign({fecha:f, items:[]}, S.diario[f] || {});
    const nombre = texto.charAt(0).toUpperCase() + texto.slice(1);
    const r = estimarComida(texto);
    if (r.partes.length){
      const t = r.total;
      const cantTxt = r.partes.map(x => `${x.cant && x.cant !== "en el bocadillo" ? x.cant + " " : ""}${x.nombre.toLowerCase()}${x.gramos!=null ? ` (${fmt(x.gramos)} ${x.u})` : ""}`).join(" + ")
        + (r.noEntiendo.length ? ` · sin contar: ${r.noEntiendo.join(", ")}` : "");
      d.items = (d.items||[]).concat([{id:nuevoId(), comida:fd.comida || comidaPorHora(), nombre, cantTxt, est:true,
        partes: r.partes.map(x => ({n:x.nombre, cant:x.cant, gramos:x.gramos, kcal:Math.round(x.kcal)})),
        kcal:Math.round(t.kcal), p:+t.p.toFixed(1), c:+t.c.toFixed(1), g:+t.g.toFixed(1)}]);
      await guardarDia(f, d);
      toast(r.noEntiendo.length ? `Apuntado (≈ ${fmt(t.kcal)} kcal). Ojo: «${r.noEntiendo[0]}» no está contado.` : `Apuntado: ≈ ${fmt(t.kcal)} kcal`);
      return;
    }
    const kc = num(fd.kcal);
    if (fd.kcal && fd.kcal.trim() && kc == null){ toast("Las kcal tienen que ser un número (o déjalas vacías)."); return; }
    d.items = (d.items||[]).concat([{id:nuevoId(), comida:fd.comida || comidaPorHora(), nombre, cantTxt:"",
      kcal: kc == null ? null : Math.round(kc), p:num(fd.p)||0, c:num(fd.c)||0, g:num(fd.g)||0}]);
    await guardarDia(f, d);
    toast(kc == null ? "Apuntado sin calorías. Tócalo cuando quieras ponérselas." : "Apuntado");
  }
  else if (k === "editItem"){
    const f = S.dietaFecha; const d = Object.assign({}, S.diario[f] || {items:[]});
    const id = fm.dataset.id;
    const kc = num(fd.kcal); if (fd.kcal && fd.kcal.trim() && kc==null){ toast("Las kcal tienen que ser un número (o déjalas vacías)."); return; }
    d.items = (d.items||[]).map(i => {
      if (i.id !== id) return i;
      const n = Object.assign({}, i, {nombre:(fd.nombre||i.nombre).trim(), comida:fd.comida || i.comida, kcal: kc==null ? null : Math.round(kc), p:num(fd.p)||0, c:num(fd.c)||0, g:num(fd.g)||0});
      if (fd.cantTxt != null) n.cantTxt = fd.cantTxt.trim();
      if (fd.cant != null && num(fd.cant) != null){ n.q = num(fd.cant); n.cantTxt = n.u==="ud" ? `${fmt(n.q,2)} ud` : `${fmt(n.q)} ${n.u||"g"}`; }
      return n;
    });
    S.itemEdit = null;
    await guardarDia(f, d); toast("Cambios guardados");
  }
  else if (k === "addAlimento"){
    const kc = num(fd.kcal); if (!fd.nombre || kc==null){ toast("Pon el nombre y las kcal del alimento."); return; }
    const [base, unidad] = fd.base.split("|");
    const id = S.alEdit || slug(fd.nombre) || nuevoId();
    const doc = {nombre:fd.nombre.trim(), base:+base, unidad, kcal:kc, p:num(fd.p)||0, c:num(fd.c)||0, g:num(fd.g)||0};
    if (fd.nota && fd.nota.trim()) doc.nota = fd.nota.trim();
    const editando = !!S.alEdit;
    S.alimentos = S.alimentos.filter(a => a.id!==id).concat([Object.assign({id}, doc)]).sort((a,b) => a.nombre.localeCompare(b.nombre,"es"));
    S.alEdit = null; render(); await escribir("alimentos/"+id, doc); toast(editando ? "Alimento actualizado" : "Alimento guardado");
  }
});

window.addEventListener("online", () => { enviarHoja(); sincronizar(); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") sincronizar(); });
setInterval(() => { if (document.visibilityState === "visible") sincronizar(); }, 90000);
document.getElementById("imp-file").addEventListener("change", e => { const f = e.target.files && e.target.files[0]; e.target.value = ""; if (f) leerCopia(f); });

let toastT = null;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 3200); }

init();
})();
</script>

if ("serviceWorker" in navigator) { window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); }); }
