<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FIT-ALL</title>
<meta name="description" content="Entreno, dieta, peso y progreso en un solo sitio.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FIT-ALL">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: una sola columna tipo app móvil (máx. 640px), cabecera con la fase del ciclo, barra de pestañas fija abajo con iconos en círculos de cristal.
   Color: siempre oscuro. Fondo negro, recuadros en gris, títulos e iconos en verde neón; los macros llevan los colores de los discos olímpicos. */
:root{
  --bg:#000000; --surface:#1c1c1f; --surface-2:#2a2a2e; --line:#38383d;
  --fg:#f2f2f5; --muted:#a3a3ad;
  --neon:#39ff14; --neon-glow:rgba(57,255,20,.45); --neon-soft:rgba(57,255,20,.14);
  --accent:#39ff14; --accent-fg:#000000; --accent-soft:rgba(57,255,20,.14);
  --blue:#4d8bff; --red:#ff5d63; --yellow:#f2c230; --green:#39d96a; --warn:#ff9f43;
  --f-display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
  color-scheme:dark;
}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums}
*{box-sizing:border-box}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 150px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance;color:var(--neon)}
h1,h2{text-shadow:0 0 14px var(--neon-glow)}
h1{font-size:30px;line-height:1}
h2{font-size:22px;line-height:1.1}
h3{font-size:18px;line-height:1.15}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--neon);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Cabecera */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:10px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;border-bottom:1px solid var(--line);margin-bottom:16px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.phase{text-align:right;font-size:13px;line-height:1.25;min-width:0}
.phase b{font-family:var(--f-display);font-size:18px;display:block;color:var(--neon)}

/* Navegación */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(0,0,0,.72);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);border-top:1px solid rgba(255,255,255,.08);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{background:none;border:0;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--muted)}
.nav .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--neon);
  background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,.04));
  border:1px solid rgba(255,255,255,.18);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25),inset 0 -1px 0 rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.5);
  -webkit-backdrop-filter:blur(12px) saturate(170%);backdrop-filter:blur(12px) saturate(170%);transition:box-shadow .2s,background .2s}
.nav .ic svg{width:22px;height:22px;filter:drop-shadow(0 0 4px var(--neon-glow))}
.nav button[aria-current="page"]{color:var(--neon)}
.nav button[aria-current="page"] .ic{background:linear-gradient(160deg,rgba(57,255,20,.30),rgba(57,255,20,.08));border-color:rgba(57,255,20,.55);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 0 16px var(--neon-glow),0 4px 14px rgba(0,0,0,.5)}

/* Bloques */
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
hr{border:0;border-top:1px solid var(--line);margin:4px 0}

.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:9px 14px;font-weight:600;line-height:1.1}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:none}
.btn.danger{color:var(--red);background:none;border-color:var(--line)}
.btn.sm{padding:6px 10px;font-size:14px}
.btn.block{width:100%;padding:13px}
.btn:disabled{opacity:.5;cursor:default}

input.tx,select.tx,textarea.tx{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0}
textarea.tx{resize:vertical;min-height:40px}
label.lb{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600;min-width:0}
label.lb > input,label.lb > select{color:var(--fg);font-weight:400;font-size:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:420px){.grid4{grid-template-columns:repeat(2,1fr)}}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}

/* Sesiones de hoy */
.ses{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center}
.ses-n{font-family:var(--f-display);font-size:26px;font-weight:700;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--fg)}
.ses.hecha .ses-n{background:var(--green);color:var(--surface)}

/* Macros */
.macro{display:flex;flex-direction:column;gap:5px}
.macro-top{display:flex;justify-content:space-between;font-size:14px;gap:8px}
.bar{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:5px}
.bar.over i{background:var(--warn)!important}
.kcal-big{font-family:var(--f-display);font-size:40px;font-weight:700;line-height:1}

/* Interruptores */
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.tog:first-of-type{border-top:0}
.sw{width:50px;height:30px;border-radius:15px;background:var(--surface-2);border:1px solid var(--line);position:relative;flex:none;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:left .15s}
.sw[aria-pressed="true"]{background:var(--green);border-color:var(--green)}
.sw[aria-pressed="true"]::after{left:23px;background:var(--surface)}

/* Editor de entreno */
.ex{display:flex;flex-direction:column;gap:10px}
.ex-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ex-meta{font-size:13px;color:var(--muted)}
.hint{font-size:13px;padding:7px 10px;border-radius:8px;background:var(--surface-2);color:var(--fg)}
.hint.up{background:color-mix(in srgb,var(--green) 14%,transparent);color:var(--green);font-weight:600}
.set{display:grid;grid-template-columns:22px 1fr 14px 1fr 44px;gap:8px;align-items:center}
.set.solo{grid-template-columns:22px 1fr 44px}
.si{font-family:var(--f-display);font-size:18px;color:var(--muted);text-align:center}
.fld{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding-right:8px;min-width:0}
.fld input{border:0;background:none;width:100%;min-width:0;padding:9px 8px;font-size:17px;font-weight:600;text-align:right}
.fld input::placeholder{color:var(--muted);opacity:.55;font-weight:500}
.fld span{font-size:12px;color:var(--muted)}
.x{text-align:center;color:var(--muted)}
.chk{width:44px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);font-weight:700;font-size:18px;color:var(--muted)}
.set.ok .chk{background:var(--green);border-color:var(--green);color:var(--surface)}
.set.ok .fld{border-color:color-mix(in srgb,var(--green) 60%,var(--line))}

/* Temporizador */
.timer{position:fixed;left:0;right:0;z-index:9;bottom:calc(90px + env(safe-area-inset-bottom,0px));padding-inline:16px;pointer-events:none}
.timer-in{max-width:608px;margin:0 auto;background:var(--fg);color:var(--bg);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px;pointer-events:auto;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.timer-t{font-family:var(--f-display);font-size:32px;font-weight:700;min-width:84px}
.timer-in .btn{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 40%,transparent)}
.timer-bar{height:4px;border-radius:2px;background:color-mix(in srgb,var(--bg) 25%,transparent);overflow:hidden;flex:1;min-width:30px}
.timer-bar i{display:block;height:100%;background:var(--bg)}

/* Listas */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .grow{display:flex;flex-direction:column}
.li button.lnk{background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;flex:1;min-width:0}
.iconbtn{background:none;border:0;color:var(--muted);padding:6px 8px;border-radius:6px;font-size:18px;line-height:1}
.meal-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-top:4px}

.tbl-w{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 6px;border-top:1px solid var(--line);white-space:nowrap}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-top:0}
td.n,th.n{text-align:right}

.chart{width:100%;height:auto;display:block}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--f-display);font-size:26px;line-height:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

details > summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
details > summary::-webkit-details-marker{display:none}
details > summary::after{content:"+";font-size:20px;color:var(--muted)}
details[open] > summary::after{content:"−"}

.banner{background:color-mix(in srgb,var(--warn) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line));color:var(--fg);border-radius:var(--r);padding:12px 14px;font-size:14px}
.empty{padding:22px 10px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));z-index:20;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:15px;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.25)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
/* Agua */
.agua-big{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1;color:var(--blue)}
.gotas{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-width:360px}
.gota{background:none;border:0;padding:4px;border-radius:10px;aspect-ratio:1;display:grid;place-items:center}
.gota svg{width:100%;height:100%;max-width:30px;fill:transparent;stroke:color-mix(in srgb,var(--blue) 55%,var(--line));stroke-width:1.6;transition:fill .15s,filter .15s}
.gota.llena svg{fill:var(--blue);stroke:var(--blue);filter:drop-shadow(0 0 6px rgba(77,139,255,.55))}
/* Menú del día */
.menu-c{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.menu-list > .menu-c:first-child{border-top:0}
.menu-c.hecha{padding:8px 0}
/* Base de la app instalada */
html{-webkit-text-size-adjust:100%;color-scheme:dark}
body{margin:0;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
img{max-width:100%}
[hidden]{display:none!important}
input.tx,select.tx,textarea.tx{font-size:16px!important}
.install{display:flex;gap:12px;align-items:center}
.install img{width:48px;height:48px;border-radius:11px;flex:none}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="eyebrow" id="eyebrow">Entreno y dieta</span>
      <h1>FIT-ALL</h1>
    </div>
    <div class="phase" id="phase"></div>
  </header>
  <main id="view" aria-live="polite"></main>
</div>

<div class="timer" id="timer" hidden></div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="imp-file" accept=".json,application/json" hidden>

<nav class="nav" aria-label="Secciones">
  <div class="nav-in" id="nav">
    <button data-tab="ajustes"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></span>Ajustes</button>
    <button data-tab="progreso"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18M5 16l5-5 4 3 6-7"/></svg></span>Progreso</button>
    <button data-tab="hoy"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>Hoy</button>
    <button data-tab="entreno"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg></span>Entreno</button>
    <button data-tab="dieta"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="7"/><circle cx="12" cy="13" r="3"/><path d="M12 3v3"/></svg></span>Dieta</button>
  </div>
</nav>

<script>
(function(){
"use strict";

/* ---------- utilidades ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = (n, d=0) => (n==null || isNaN(n)) ? "—" : Number(n).toLocaleString("es-ES",{maximumFractionDigits:d});
const num = v => { if (v==null) return null; const s=String(v).trim().replace(",","."); if (s==="") return null; const n=parseFloat(s); return isNaN(n)?null:n; };
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const hoyISO = () => iso(new Date());
const parseISO = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDias = (s, n) => { const d = parseISO(s); d.setDate(d.getDate()+n); return iso(d); };
const fechaLarga = s => parseISO(s).toLocaleDateString("es-ES",{weekday:"long", day:"numeric", month:"long"});
const fechaCorta = s => parseISO(s).toLocaleDateString("es-ES",{weekday:"short", day:"numeric", month:"short"});
const ddmm = s => { const d=parseISO(s); return `${d.getDate()}/${d.getMonth()+1}`; };
const DIAS = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
const DIAS_SEM = ["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
const TURNOS = ["Mañana","Mediodía","Tarde","Noche"];
const MODOS = {kg:"Peso (kg × reps)", corporal:"Peso corporal (+lastre)", tiempo:"Tiempo (segundos)", cardio:"Duración (minutos)"};
const AJUSTES = {igual:"Series indicadas", menos1:"−1 serie", descarga:"−40 % de series", mas1:"+1 serie"};
const clone = o => JSON.parse(JSON.stringify(o));
const slug = s => String(s||"").trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,60);
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch(e) { return null; } };
const lsSet = (k, v) => { try { v==null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} };

/* ---------- estado ---------- */
const S = {
  db:null, sinDb:false, cargado:{},
  plan:null, obj:null, alimentos:[], sesiones:[], diario:{}, medidas:[],
  tab: "hoy", ed:null, dietaFecha: hoyISO(), progEj:null, borrarArm:null,
  timer:null, importPend:null, rutEd:null, cfgEd:null, cfgDirty:false, alEdit:null, itemEdit:null, medEdit:null, exCambio:null
};
const CICLO_DEF = {semanas:12, fases:[
  {nombre:"Adaptación y técnica", rir:"3 reps de margen", series:"Quita 1 serie a cada ejercicio", ajuste:"menos1"},
  {nombre:"Acumular", rir:"2 reps de margen", series:"Las series indicadas", ajuste:"igual"},
  {nombre:"Apretar", rir:"1 rep de margen (0-1 en máquinas)", series:"Las series indicadas", ajuste:"igual"},
  {nombre:"Descarga", rir:"3-4 reps de margen", series:"Series −40 % y sin HIIT del jueves", ajuste:"descarga"}
]};
const OBJ_DEF = {kcal:2350, p:150, c:280, g:70, aguaL:3, vasoMl:250, inicio:"2026-09-28", nombre:"", ciclo:CICLO_DEF,
  suples:[{k:"proteina", nombre:"Proteína en polvo", det:"Un cacito; súmalo también en Dieta"},{k:"creatina", nombre:"Creatina", det:"3-5 g, cualquier hora del día"}],
  comidas:["Desayuno","Media mañana","Comida","Merienda","Cena"]};
const obj = () => Object.assign({}, OBJ_DEF, S.obj || {});
const comidas = () => { const c = obj().comidas; return (c && c.length) ? c : OBJ_DEF.comidas; };
const ciclo = () => { const c = obj().ciclo || CICLO_DEF; return {semanas: c.semanas || 12, fases: (c.fases && c.fases.length) ? c.fases : CICLO_DEF.fases}; };

/* ---------- fase del ciclo ---------- */
function fase(f){
  const diff = Math.round((parseISO(f) - parseISO(obj().inicio)) / 86400000);
  if (diff < 0) return null;
  const C = ciclo(), L = C.fases.length;
  const semana = Math.floor(diff/7) + 1;
  const sc = ((semana-1) % L) + 1;
  return Object.assign({ajuste:"igual"}, C.fases[sc-1], {semana, ciclo: Math.floor((semana-1)/L)+1, sc, total:C.semanas, fuera: semana>C.semanas});
}
function seriesSugeridas(objetivo, f){
  const m = String(objetivo||"").match(/^(\d+)\s*×/);
  if (!m) return 1;
  const base = +m[1];
  if (!f) return base;
  if (f.ajuste === "menos1") return Math.max(1, base-1);
  if (f.ajuste === "descarga") return Math.max(1, Math.round(base*0.6));
  if (f.ajuste === "mas1") return base+1;
  return base;
}
function repsTop(objetivo){
  const m = String(objetivo||"").match(/×\s*(\d+)(?:-(\d+))?/);
  if (!m) return null; return +(m[2]||m[1]);
}
function descansoSeg(t){
  const m = String(t||"").match(/(\d+)(?:-(\d+))?\s*(min|s)\b/);
  if (!m) return 0;
  const a=+m[1], b=m[2]?+m[2]:a, v=(a+b)/2;
  return m[3]==="min" ? Math.round(v*60) : Math.round(v);
}

const IDB_NOMBRE = "fitall", IDB_ALMACEN = "docs";
let idb = null;
function abrirIDB(){
  return new Promise(res => {
    try {
      const r = indexedDB.open(IDB_NOMBRE, 1);
      r.onupgradeneeded = () => r.result.createObjectStore(IDB_ALMACEN);
      r.onsuccess = () => res(r.result);
      r.onerror = () => res(null);
      r.onblocked = () => res(null);
    } catch(e){ res(null); }
  });
}
function leerTodo(){
  if (idb) return new Promise((res, rej) => {
    try { const r = idb.transaction(IDB_ALMACEN).objectStore(IDB_ALMACEN).getAll(); r.onsuccess = () => res(r.result || []); r.onerror = () => rej(r.error); }
    catch(e){ rej(e); }
  });
  const o = lsGet("fitall_docs") || {};
  return Promise.resolve(Object.entries(o).map(([path, data]) => ({path, data})));
}
function escribirVarios(ops, vaciar){
  if (idb) return new Promise((res, rej) => {
    try {
      const t = idb.transaction(IDB_ALMACEN, "readwrite"), st = t.objectStore(IDB_ALMACEN);
      if (vaciar) st.clear();
      ops.forEach(([path, data]) => data == null ? st.delete(path) : st.put({path, data}, path));
      t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    } catch(e){ rej(e); }
  });
  const o = vaciar ? {} : (lsGet("fitall_docs") || {});
  ops.forEach(([path, data]) => { if (data == null) delete o[path]; else o[path] = data; });
  try { localStorage.setItem("fitall_docs", JSON.stringify(o)); return Promise.resolve(); } catch(e){ return Promise.reject(e); }
}
const colas = {};
function escribir(path, data){
  const p = (colas[path] || Promise.resolve()).then(() => escribirVarios([[path, data]])).catch(errGuardar);
  colas[path] = p; return p;
}
function borrarDoc(path){ return escribir(path, null); }
function errGuardar(){ toast("No se pudo guardar en este móvil. Comprueba que no estás en modo privado y que queda espacio."); }
function repartir(docs){
  S.plan = []; S.obj = null; S.alimentos = []; S.sesiones = []; S.diario = {}; S.medidas = [];
  for (const {path, data} of docs){
    const i = path.indexOf("/"), c = path.slice(0, i), id = path.slice(i+1);
    if (path === "plan/rutina") S.plan = (data && data.sesiones) || [];
    else if (path === "config/objetivos") S.obj = data;
    else if (c === "alimentos") S.alimentos.push(Object.assign({id}, data));
    else if (c === "sesiones") S.sesiones.push(Object.assign({id}, data));
    else if (c === "diario") S.diario[id] = data;
    else if (c === "medidas") S.medidas.push(Object.assign({id}, data));
  }
  S.alimentos.sort((a,b) => a.nombre.localeCompare(b.nombre, "es"));
  S.sesiones.sort((a,b) => a.fecha<b.fecha?1 : a.fecha>b.fecha?-1 : (b.n||0)-(a.n||0));
  S.medidas.sort((a,b) => a.fecha<b.fecha?-1 : 1);
  S.cargado.plan = S.cargado.obj = S.cargado.sesiones = true;
}

function resumenCopia(d){
  const n = (d.sesiones||[]).length, m = (d.medidas||[]).length, dd = Object.keys(d.diario||{}).length;
  return `${n} sesiones, ${m} medidas y ${dd} días de dieta`;
}
async function leerCopia(file){
  let d;
  try { d = JSON.parse(await file.text()); } catch(e){ toast("Ese archivo no es una copia de FIT-ALL."); return; }
  if (!d || typeof d !== "object" || (!d.rutina && !d.sesiones && !d.objetivos)){ toast("Ese archivo no es una copia de FIT-ALL."); return; }
  const hayDatos = (S.plan||[]).length || S.sesiones.length || S.medidas.length || Object.keys(S.diario).length;
  if (!hayDatos){ await aplicarCopia(d); return; }
  S.importPend = d; S.tab = "ajustes"; render(); window.scrollTo(0,0);
}
async function aplicarCopia(d){
  const ops = [];
  if (d.objetivos) ops.push(["config/objetivos", d.objetivos]);
  if (Array.isArray(d.rutina)) ops.push(["plan/rutina", {sesiones: d.rutina}]);
  (d.sesiones||[]).forEach(x => { const {id, ...r} = x; ops.push(["sesiones/" + (id || `${x.fecha}_${x.n}`), r]); });
  Object.entries(d.diario||{}).forEach(([k, v]) => ops.push(["diario/" + k, v]));
  (d.medidas||[]).forEach(x => { const {id, ...r} = x; ops.push(["medidas/" + (id || x.fecha), r]); });
  const al = (d.alimentos && d.alimentos.length) ? d.alimentos : ALIMENTOS_BASE;
  al.forEach(x => { const {id, ...r} = x; ops.push(["alimentos/" + (id || slug(x.nombre) || nuevoId()), r]); });
  try { await escribirVarios(ops, true); } catch(e){ errGuardar(); return; }
  repartir(await leerTodo());
  S.importPend = null; S.cfgEd = null; S.cfgDirty = false; S.rutEd = null; S.ed = null;
  S.tab = "hoy"; render(); window.scrollTo(0,0);
  toast(`Copia cargada: ${resumenCopia(d)}.`);
}
async function exportar(){
  const data = JSON.stringify({app:"FIT-ALL", formato:1, exportado:new Date().toISOString(), objetivos:S.obj, rutina:S.plan, sesiones:S.sesiones, diario:S.diario, medidas:S.medidas, alimentos:S.alimentos}, null, 2);
  const nombre = `fit-all-copia-${hoyISO()}.json`;
  let file = null;
  try { file = new File([data], nombre, {type:"application/json"}); } catch(e) {}
  try {
    if (file && navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:"Copia de FIT-ALL"});
      lsSet("fitall_ultima_copia", hoyISO()); render(); return;
    }
  } catch(e){ if (e && e.name === "AbortError") return; }
  const url = URL.createObjectURL(file || new Blob([data], {type:"application/json"}));
  const a = document.createElement("a"); a.href = url; a.download = nombre; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 2000);
  lsSet("fitall_ultima_copia", hoyISO()); render();
}

function ultima(nombre, antesDe){

function records(excluirId){

async function guardarSesion(){

}

function lineChart(series, opt={}){
  const W=340, H=170, L=38, R=10, T=12, B=24;
  const pts = series.flatMap(s => s.pts);
  if (pts.length < 1) return `<div class="empty">Sin datos todavía.</div>`;
  let xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  let x0 = Math.min(...xs), x1 = Math.max(...xs); if (x1===x0){ x0-=86400000*3; x1+=86400000*3; }
  let y0 = Math.min(...ys), y1 = Math.max(...ys);
  const padY = Math.max((y1-y0)*0.15, opt.minPad||1); y0 -= padY; y1 += padY;
  const step = niceStep((y1-y0)/4); y0 = Math.floor(y0/step)*step; y1 = Math.ceil(y1/step)*step;
  const sx = x => L + (x-x0)/(x1-x0)*(W-L-R), sy = y => T + (1-(y-y0)/(y1-y0))*(H-T-B);
  let g = "";
  for (let v=y0; v<=y1+1e-9; v+=step){ g += `<line x1="${L}" x2="${W-R}" y1="${sy(v)}" y2="${sy(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${sy(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmt(v, step<1?1:0)}</text>`; }
  const dl = x => { const d=new Date(x); return `${d.getDate()}/${d.getMonth()+1}`; };
  g += `<text x="${L}" y="${H-6}" font-size="11" fill="var(--muted)">${dl(x0)}</text><text x="${W-R}" y="${H-6}" font-size="11" fill="var(--muted)" text-anchor="end">${dl(x1)}</text>`;
  series.forEach(s => {
    const P = s.pts.slice().sort((a,b) => a.x-b.x);
    if (s.line && P.length > 1){
      const d = P.map((p,i) => `${i?"L":"M"}${sx(p.x).toFixed(1)},${sy(p.y).toFixed(1)}`).join("");
      if (s.area) g += `<path d="${d}L${sx(P[P.length-1].x).toFixed(1)},${H-B}L${sx(P[0].x).toFixed(1)},${H-B}Z" fill="${s.color}" opacity=".10"/>`;
      g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.w||2.5}" ${s.dash?'stroke-dasharray="4 4"':""} stroke-linejoin="round" stroke-linecap="round"/>`;
    }
    if (s.dots) P.forEach(p => { g += `<circle cx="${sx(p.x).toFixed(1)}" cy="${sy(p.y).toFixed(1)}" r="${s.r||3}" fill="${s.color}" opacity="${s.op||1}"/>`; });
    if (s.line && P.length){ const p = P[P.length-1]; g += `<circle cx="${sx(p.x).toFixed(1)}" cy="${sy(p.y).toFixed(1)}" r="4.5" fill="var(--surface)" stroke="${s.color}" stroke-width="2.5"/>`; }
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.label||"Gráfica")}">${g}</svg>`;
}
function niceStep(raw){ const p = Math.pow(10, Math.floor(Math.log10(raw||1))); const n = raw/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }

        <div class="stat"><span class="muted small">Media 7 días</span><b>${fmt(a1,1)}</b></div>
        <div class="stat"><span class="muted small">Cambio semanal</span><b>${cambio==null?"—":(cambio>0?"+":"")+fmt(cambio,1)+" %"}</b></div>
      </div>
      ${lineChart([{pts:M.map(m => ({x:ts(m.fecha), y:m.peso})), dots:true, color:"var(--muted)", r:2.5, op:.6},{pts:media, line:true, area:false, color:"var(--accent)"}], {label:"Peso corporal y media de 7 días", minPad:0.5})}
      <span class="muted small">Puntos: cada pesada · Línea: media de 7 días. Objetivo: bajar un 0,5-0,75 % por semana.</span>
      <div class="row small"><span>Cintura: <b>${cUlt?fmt(cUlt.cintura,1)+" cm":"—"}</b>${cIni && cUlt && cIni!==cUlt?` <span class="muted">(${cUlt.cintura-cIni.cintura>0?"+":""}${fmt(cUlt.cintura-cIni.cintura,1)} cm desde ${ddmm(cIni.fecha)})</span>`:""}</span></div>

const PESO_COMIDA = {desayuno:0.22, comida:0.33, cena:0.23, snack:0.11};
function tipoComida(n){
  const s = slug(n);
  if (s.includes("desayuno")) return "desayuno";
  if (s === "comida" || s.includes("almuerzo")) return "comida";
  if (s.includes("cena")) return "cena";
  return "snack";
}
const hashTxt = s => { let h = 2166136261; for (const ch of String(s)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
const alimentoId = id => S.alimentos.find(a => a.id === id);
function redondear(q, al){
  if (al.unidad === "ud") { const paso = al.id === "huevo" ? 1 : 0.5; return Math.max(paso, Math.round(q/paso)*paso); }
  const paso = q < 60 ? 5 : 10; return Math.max(paso, Math.round(q/paso)*paso);
}
function macrosDe(al, q){ const r = q/(al.base||100); return {kcal:al.kcal*r, p:al.p*r, c:al.c*r, g:al.g*r}; }
function montarPlato(tpl, obj){
  const items = tpl.items.map(([id, q, rol]) => ({al: alimentoId(id), q, q0: q, rol}));
  if (items.some(i => !i.al)) return null;
  const suma = (fil, k) => items.filter(fil).reduce((a, i) => a + macrosDe(i.al, i.q)[k], 0);
  const P = items.find(i => i.rol === "p"), E = items.find(i => i.rol === "e");
  if (P){
    const falta = obj.p - suma(i => i !== P, "p");
    const porU = macrosDe(P.al, 1).p;
    if (porU > 0) P.q = Math.min(P.q0*2, Math.max(P.q0*0.6, falta/porU));
    P.q = redondear(P.q, P.al);
  }
  if (E){
    const resto = obj.kcal - suma(i => i !== E, "kcal");
    const porU = macrosDe(E.al, 1).kcal;
    if (porU > 0) E.q = Math.min(E.q0*2.2, Math.max(E.q0*0.4, resto/porU));
    E.q = redondear(E.q, E.al);
  }
  const tot = {kcal:0,p:0,c:0,g:0};
  items.forEach(i => { const m = macrosDe(i.al, i.q); for (const k in tot) tot[k] += m[k]; });
  return {nombre: tpl.nombre, items: items.map(i => ({al:i.al, q:i.q})), tot};
}
const qTxt = (al, q) => al.unidad === "ud" ? `${fmt(q,1)} ${q===1?"ud":"uds"}` : `${fmt(q)} ${al.unidad}`;
const NOMBRES_UD = {"huevo":["huevo","huevos"],"platano":["plátano","plátanos"],"manzana":["manzana","manzanas"],"naranja":["naranja","naranjas"],
  "yogur-natural":["yogur natural","yogures naturales"],"proteina-en-polvo-whey":["cacito de proteína en polvo","cacitos de proteína en polvo"],
  "aceite-de-oliva":["cucharada de aceite de oliva","cucharadas de aceite de oliva"],"galletas-maria":["galleta María","galletas María"],
  "queso-en-lonchas-tranchete":["loncha de queso","lonchas de queso"]};
function itemTxt(al, q){
  if (al.unidad === "ud"){
    const n = NOMBRES_UD[al.id];
    const cant = q === 0.5 ? "½" : fmt(q, 1);
    if (n) return `${cant} ${q > 1 ? n[1] : n[0]}`;
    return `${cant} ${q > 1 ? "uds" : "ud"} de ${al.nombre.toLowerCase()}`;
  }
  return `${fmt(q)} ${al.unidad} de ${al.nombre.toLowerCase()}`;
}
// Menú de un día. Con conComido=true descuenta lo ya apuntado y solo planifica las comidas que faltan.
function planDia(fecha, conComido){
  const o = obj(), L = comidas();
  const d = conComido ? (S.diario[fecha] || {}) : {};
  const items = d.items || [];
  const hechas = new Set(items.map(i => i.comida));
  const comido = conComido ? totalesDia(fecha) : {kcal:0, p:0};
  const pend = L.filter(c => !hechas.has(c));
  const pesoTot = pend.reduce((a, c) => a + PESO_COMIDA[tipoComida(c)], 0) || 1;
  const kRest = Math.max(0, o.kcal - comido.kcal), pRest = Math.max(0, o.p - comido.p);
  const rer = lsGet("fitall_menu_" + fecha) || {};
  const usados = new Set();
  return L.map(c => {
    if (hechas.has(c)) return {comida:c, hecha:true, kcal: items.filter(i => i.comida===c).reduce((a,i) => a+(i.kcal||0), 0)};
    const w = PESO_COMIDA[tipoComida(c)] / pesoTot;
    const objC = {kcal: kRest*w, p: pRest*w};
    const tipo = tipoComida(c);
    if (tipo === "comida" || tipo === "cena") return {comida:c, libre:true, objC};
    if (objC.kcal < 120) return {comida:c, ligera:true, objC};
    const lista = (PLANTILLAS[tipoComida(c)] || []).map(t => montarPlato(t, objC)).filter(Boolean);
    if (!lista.length) return {comida:c, sinPlantilla:true, objC};
    let idx = (hashTxt(fecha + "|" + c) + (rer[c] || 0)) % lista.length;
    for (let k = 0; k < lista.length && usados.has(lista[idx].nombre); k++) idx = (idx + 1) % lista.length;
    usados.add(lista[idx].nombre);
    return Object.assign({comida:c, objC}, lista[idx]);
  });
}

  }).join("");
  return `<section class="card sec">
    <div class="sec-h"><span class="eyebrow">Tu día de comidas</span><span class="muted small">Se ajusta a lo que llevas</span></div>
    ${ent.length ? `<div class="hint">Hoy entrenas (${esc(ent.map(s => s.nombre).join(" y "))}): deja la mayor parte de los hidratos en la comida de antes o de después del entreno.</div>` : ""}

async function apuntarMenu(c){
  const f = hoyISO();
  const m = planDia(f, true).find(x => x.comida === c && x.items);
  if (!m) return;
  const d = Object.assign({fecha:f, items:[]}, S.diario[f] || {});
  d.items = (d.items||[]).concat(m.items.map(i => { const x = macrosDe(i.al, i.q); return {id:nuevoId(), comida:c, nombre:i.al.nombre, ref:i.al.id, q:i.q, u:i.al.unidad, cantTxt:qTxt(i.al, i.q), kcal:Math.round(x.kcal), p:+x.p.toFixed(1), c:+x.c.toFixed(1), g:+x.g.toFixed(1)}; }));
  await guardarDia(f, d);
  toast(`${c} apuntada. Puedes tocar cada alimento si cambiaste algo.`);

function resumenUltimo(s){
  const out = [];

    const u = ultima(e.nombre);

function eventosRecordatorio(r, desde, dias){
  const ev = [], ahora = new Date();
  for (let k = 0; k < dias; k++){
    const f = addDias(desde, k), dow = parseISO(f).getDay();
    const fz = fase(f);
    const push = (hora, minutos, titulo, texto, tipo) => {
      if (!/^\d{1,2}:\d{2}$/.test(hora||"")) return;
      const [h, m] = hora.split(":").map(Number);
      const ini = parseISO(f); ini.setHours(h, m, 0, 0);
      if (ini <= ahora) return;
      ev.push({ini, fin: new Date(ini.getTime() + minutos*60000), titulo, texto, uid:`${f}-${tipo}-${slug(titulo).slice(0,30)}@fit-all`});
    };
    if (r.pesarOn && r.pesarDias.includes(dow)) push(r.pesar, 5, "Pésate en ayunas", frase("pesar", f) + "\n\nApúntalo en FIT-ALL (pantalla Hoy).", "pesar");
    if (r.entrenoOn){
      for (const s of sesionesDeDia(f)){
        if (fz && fz.ajuste === "descarga" && /hiit/i.test(s.nombre)) continue;
        const lineas = [frase("entreno", f, s.nombre), ""];
        if (fz && !fz.fuera) lineas.push(`Semana ${fz.semana} · ${fz.nombre}: ${fz.rir}. ${fz.series}.`, "");
        lineas.push("Hoy toca:", ...(s.ejercicios||[]).map(e => `· ${e.nombre} — ${e.objetivo}`));
        const ult = resumenUltimo(s);
        if (ult.length) lineas.push("", "Última vez:", ...ult.map(x => "· " + x));
        push(horaSesion(s, r), durMin(s.duracion), `Entreno · ${s.nombre}`, lineas.join("\n"), "entreno");
      }
    }
    if (r.comidasOn){
      const plan = planDia(f, false);
      for (const m of plan){
        const hora = r.horas[m.comida]; if (!hora) continue;
        let txt;
        if (m.items) txt = `${m.nombre}\n${m.items.map(i => `· ${itemTxt(i.al, i.q)}`).join("\n")}\n≈ ${fmt(m.tot.kcal)} kcal · ${fmt(m.tot.p)} g de proteína`;
        else if (m.libre) txt = `Lo que haya en casa. Intenta que lleve unos ${fmt(m.objC.p)} g de proteína: una ración de carne, pescado, huevos o legumbre del tamaño de tu mano.\nAl terminar, apúntalo en FIT-ALL y verás lo que te falta para hoy.`;
        else txt = "Algo ligero: fruta o yogur.";
        if (tipoComida(m.comida) === "desayuno" && (obj().suples||[]).length) txt += `\n\nNo olvides: ${(obj().suples||[]).map(x => x.nombre.toLowerCase()).join(" y ")}.`;
        txt += `\n\n${frase("comida", f, m.comida)}` + (m.libre ? "" : "\nSi comes otra cosa, apúntala en FIT-ALL y el resto del día se reajusta.");
        push(hora, 20, m.libre ? `${m.comida} · apúntala en FIT-ALL` : `${m.comida}${m.nombre ? " · " + m.nombre : ""}`, txt, "comida");
      }
    }
    if (r.dormirOn) push(r.dormir, 10, "A descansar", frase("dormir", f), "dormir");
  }
  return ev;
}
function icsTexto(ev){
  const esc2 = s => String(s).replace(/\\/g, "\\\\").replace(/;/g, "\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
  const p2 = n => String(n).padStart(2, "0");
  const loc = d => `${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}T${p2(d.getHours())}${p2(d.getMinutes())}00`;
  const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
  const enc = new TextEncoder();
  const plegar = linea => {
    const out = []; let cur = "", n = 0;
    for (const ch of linea){ const b = enc.encode(ch).length; if (n + b > (out.length ? 73 : 74)){ out.push(cur); cur = ""; n = 0; } cur += ch; n += b; }
    out.push(cur); return out.join("\r\n ");
  };
  const L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//FIT-ALL//Recordatorios//ES","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:FIT-ALL"];
  ev.forEach(e => {
    L.push("BEGIN:VEVENT", `UID:${e.uid}`, `DTSTAMP:${stamp}`, `DTSTART:${loc(e.ini)}`, `DTEND:${loc(e.fin)}`, `SUMMARY:${esc2(e.titulo)}`, `DESCRIPTION:${esc2(e.texto)}`,
      "BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${esc2(e.titulo)}`, "TRIGGER:PT0S", "END:VALARM", "END:VEVENT");
  });
  L.push("END:VCALENDAR");
  return L.map(plegar).join("\r\n") + "\r\n";
}
async function crearRecordatorios(modo){
  const r = S.cfgEd && S.cfgEd.recordatorios ? normRec(S.cfgEd.recordatorios) : rec();
  const ev = eventosRecordatorio(r, hoyISO(), (r.semanas||2)*7);
  if (!ev.length){ toast("No hay recordatorios que crear: activa alguno y pon las horas."); return; }
  const data = icsTexto(ev), nombre = "fit-all-recordatorios.ics";
  let file = null; try { file = new File([data], nombre, {type:"text/calendar"}); } catch(e) {}
  if (modo === "compartir"){
    try { if (file && navigator.canShare && navigator.canShare({files:[file]})) { await navigator.share({files:[file], title:"Recordatorios de FIT-ALL"}); lsSet("fitall_cal_hasta", addDias(hoyISO(), (r.semanas||2)*7)); render(); return; } }
    catch(e){ if (e && e.name === "AbortError") return; }
  }
  const url = URL.createObjectURL(file || new Blob([data], {type:"text/calendar"}));
  const a = document.createElement("a"); a.href = url; a.download = nombre; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 3000);
  lsSet("fitall_cal_hasta", addDias(hoyISO(), (r.semanas||2)*7)); render();
  toast(`${ev.length} recordatorios listos. Pulsa «Añadir todo» en el calendario.`);
}

function payloadSesion(s, vaciar){
  const fz = fase(s.fecha); if (!fz) return null;
  let ejercicios = (s.ejercicios || []).map(e => ({nombre:e.nombre, series:(e.series||[]).map(x => ({kg:x.kg ?? null, reps:x.reps ?? null})), rir:e.rir ?? null, notas:e.notas || ""}));

function payloadMedidas(semana){

async function enviarHoja(manual){

  if (!cuerpo.sesiones.length && !cuerpo.medidas.length && !cuerpo.dieta.length) return null;
  if (!navigator.onLine) return null;
  enviando = true;
  try {
    const r = await fetch(url, {method:"POST", body:JSON.stringify(cuerpo), headers:{"Content-Type":"text/plain;charset=utf-8"}});
    const j = await r.json();
    if (!j.ok) throw new Error(j.error === "clave" ? "clave" : (j.error || "error"));
    // Quita de la cola solo lo enviado (si mientras tanto cambió algo, se queda).

    if (manual) toast(`Enviado a «${j.hoja}»: ${j.sesiones} sesiones, ${j.medidas} semanas de medidas y ${j.dieta} días de dieta.`);

function vRutina(){

    return `<section class="card sec">
      <div class="sec-h"><span class="eyebrow">Tu rutina</span><button class="btn sm pri" data-act="rutEditar">Editar rutina</button></div>

        <div class="row">
          <input class="tx grow" id="re-n-${si}-${ei}" data-r="nombre" data-si="${si}" data-ei="${ei}" value="${esc(e.nombre)}" list="lista-ej" placeholder="Nombre del ejercicio" aria-label="Ejercicio">
          <button class="iconbtn" data-act="rutMoveEj" data-si="${si}" data-ei="${ei}" data-d="-1" aria-label="Subir" ${ei===0?"disabled":""}>↑</button>
          <button class="iconbtn" data-act="rutMoveEj" data-si="${si}" data-ei="${ei}" data-d="1" aria-label="Bajar" ${ei===s.ejercicios.length-1?"disabled":""}>↓</button>
          <button class="iconbtn" data-act="rutDelEj" data-si="${si}" data-ei="${ei}" aria-label="Quitar ejercicio">✕</button>
        </div>
        <div class="grid2">
          <label class="lb">Series × reps<input class="tx" id="re-o-${si}-${ei}" data-r="objetivo" data-si="${si}" data-ei="${ei}" value="${esc(e.objetivo)}" placeholder="3 × 8-10"></label>
          <label class="lb">Descanso<input class="tx" id="re-d-${si}-${ei}" data-r="descanso" data-si="${si}" data-ei="${ei}" value="${esc(e.descanso)}" placeholder="90 s"></label>
        </div>
        <label class="lb">Cómo se registra<select class="tx" id="re-m-${si}-${ei}" data-r="modo" data-si="${si}" data-ei="${ei}">${opts(MODOS, e.modo||"kg")}</select></label>
      </div>`).join("");
    const arm = S.borrarArm === "ses"+si;
    return `<section class="card sec">
      <label class="lb">Nombre de la sesión<input class="tx" id="rs-n-${si}" data-rs="nombre" data-si="${si}" value="${esc(s.nombre)}"></label>
      <div class="grid2">
        <label class="lb">Día<select class="tx" id="rs-d-${si}" data-rs="dia" data-si="${si}">${optsL(DIAS_SEM, s.dia)}</select></label>
        <label class="lb">Turno<select class="tx" id="rs-t-${si}" data-rs="turno" data-si="${si}">${optsL(TURNOS, s.turno)}</select></label>
        <label class="lb">Tipo<input class="tx" id="rs-y-${si}" data-rs="tipo" data-si="${si}" value="${esc(s.tipo||"")}" placeholder="Fuerza"></label>
        <label class="lb">Duración<input class="tx" id="rs-u-${si}" data-rs="duracion" data-si="${si}" value="${esc(s.duracion||"")}" placeholder="60 min"></label>
      </div>
      ${ejs || `<span class="muted small">Sin ejercicios todavía.</span>`}
      <div class="row between">
        <button class="btn sm" data-act="rutAddEj" data-si="${si}">+ Ejercicio</button>

  }).join("");
  return `<div class="sec-h"><h2>Editar rutina</h2><span class="muted small">Escribe «3 × 8-10» para series × reps; el descanso en «90 s» o «2 min» arranca el temporizador.</span></div>

    <div class="row between"><button class="btn ghost" data-act="rutCancelar">Cancelar</button><button class="btn pri" data-act="rutGuardar">Guardar rutina</button></div>
    <span class="muted small">Si cambias el nombre de un ejercicio, su historial anterior se queda con el nombre viejo.</span>`;
}
async function guardarRutina(){
  const L = S.rutEd.map(s => Object.assign({}, s, {
    nombre: (s.nombre||"").trim() || "Sesión sin nombre",
    ejercicios: (s.ejercicios||[]).filter(e => (e.nombre||"").trim()).map(e => ({nombre:e.nombre.trim(), objetivo:(e.objetivo||"").trim(), descanso:(e.descanso||"").trim(), modo:e.modo||"kg"}))
  }));
  S.plan = L; S.rutEd = null; S.borrarArm = null; render();
  await escribir("plan/rutina", {sesiones:L});
  toast("Rutina guardada");
}
async function guardarCfg(){
  const o = S.cfgEd;
  const v = {kcal:num(o.kcal), p:num(o.p), c:num(o.c), g:num(o.g)};
  if (Object.values(v).some(x => x==null)) { toast("Rellena los cuatro objetivos con números."); return; }
  const sem = Math.round(num(o.ciclo.semanas)||0);
  if (sem < 1) { toast("Pon cuántas semanas dura el plan."); return; }
  const d = Object.assign({}, S.obj||{}, v, {
    aguaL: Math.min(8, Math.max(0.5, num(o.aguaL) || 3)), vasoMl: Math.min(1000, Math.max(50, Math.round(num(o.vasoMl) || 250))),
    inicio: o.inicio || OBJ_DEF.inicio, nombre: (o.nombre||"").trim(),
    ciclo: {semanas: sem, fases: o.ciclo.fases.map(f => ({nombre:(f.nombre||"").trim()||"Semana", rir:(f.rir||"").trim(), series:(f.series||"").trim(), ajuste:f.ajuste||"igual"}))},
    suples: o.suples.filter(s => (s.nombre||"").trim()).map(s => ({k: s.k || slug(s.nombre) || nuevoId(), nombre:s.nombre.trim(), det:(s.det||"").trim()})),
    comidas: o.comidas.map(c => (c||"").trim()).filter(Boolean),
    recordatorios: normRec(o.recordatorios || rec())
  });
  if (!d.comidas.length) d.comidas = OBJ_DEF.comidas.slice();
  S.obj = d; S.cfgEd = null; S.cfgDirty = false; render();
  await escribir("config/objetivos", d);
  toast("Ajustes guardados");
}
function marcarCfg(){
  S.cfgDirty = true;
  const p = $("#cfg-estado"); if (p){ p.textContent = "Cambios sin guardar"; p.className = "pill warn"; }
  const k = $("#kc-macros"); if (k && S.cfgEd){ const o=S.cfgEd; k.textContent = `Los macros suman ${fmt((num(o.p)||0)*4+(num(o.c)||0)*4+(num(o.g)||0)*9)} kcal.`; }
}

document.getElementById("nav").addEventListener("click", e => {

const view = document.getElementById("view");
view.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.in && S.ed && t.dataset.e != null && ["kg","reps","rir","notas"].includes(t.dataset.in)){
    const ex = S.ed.ejercicios[+t.dataset.e];
    if (t.dataset.in === "kg" || t.dataset.in === "reps") ex.series[+t.dataset.s][t.dataset.in] = t.value;
    else ex[t.dataset.in] = t.value;
    guardarBorrador();
  }
  if (t.id === "al-nombre" || t.id === "al-cant") actualizarPrevia();
  if (t.id === "it-cant") reescalarItem();
  if (t.dataset.inEd === "fecha" && S.ed) { if (t.value) { S.ed.fecha = t.value; guardarBorrador(); } }
  // ajustes
  if (S.cfgEd){
    const i = +t.dataset.i;
    if (t.dataset.c){ if (t.dataset.c === "semanas") S.cfgEd.ciclo.semanas = t.value; else S.cfgEd[t.dataset.c] = t.value; marcarCfg(); }
    else if (t.dataset.cf){ S.cfgEd.ciclo.fases[i][t.dataset.cf] = t.value; marcarCfg(); }
    else if (t.dataset.cs){ S.cfgEd.suples[i][t.dataset.cs] = t.value; marcarCfg(); }
    else if (t.dataset.cm){ S.cfgEd.comidas[i] = t.value; marcarCfg(); }
    else if (t.dataset.rec){
      const r = S.cfgEd.recordatorios, k = t.dataset.rec;
      if (k.startsWith("horas.")) r.horas[k.slice(6)] = t.value;
      else r[k] = t.type === "checkbox" ? t.checked : t.value;
      marcarCfg();
    }
  }
  // rutina
  if (S.rutEd){
    if (t.dataset.rs) S.rutEd[+t.dataset.si][t.dataset.rs] = t.value;
    else if (t.dataset.r){
      const e = S.rutEd[+t.dataset.si].ejercicios[+t.dataset.ei];
      e[t.dataset.r] = t.value;
      if (t.dataset.r === "nombre" && e.nuevo && nombresEjercicios().includes(t.value)) { e.modo = modoDe(t.value); const m = $(`#re-m-${t.dataset.si}-${t.dataset.ei}`); if (m) m.value = e.modo; }
    }
  }
});

view.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act;
  if (a === "tab"){ S.tab = b.dataset.tab; render(); window.scrollTo(0,0); }
  else if (a === "abrir") abrirSesion(b.dataset.f, b.dataset.n);
  else if (a === "check" && S.ed){
    const ex = S.ed.ejercicios[+b.dataset.e], st = ex.series[+b.dataset.s];
    if (!st.ok){
      const ult = ultima(ex.nombre, S.ed.fecha);
      const ph = ult ? (ult.series[+b.dataset.s] || ult.series[ult.series.length-1]) : null;
      if (st.kg === "" && ph && ph.kg) st.kg = String(ph.kg).replace(".",",");
      if (st.reps === "" && ph && ph.reps!=null) st.reps = String(ph.reps);
      if (st.reps === "" && st.kg === ""){ toast("Escribe los kilos y las repeticiones de la serie."); return; }
      st.ok = true;
      iniciarTimer(descansoSeg(ex.descanso), ex.nombre);

  }

  else if (a === "delSet" && S.ed){ const ex = S.ed.ejercicios[+b.dataset.e]; if (ex.series.length>1) ex.series.pop(); guardarBorrador(); render(); }
  else if (a === "guardarSesion") guardarSesion();

    if (S.borrarArm !== id){ S.borrarArm = id; render(); return; }

    S.borrarArm = null; S.sesiones = S.sesiones.filter(s => s.id!==id); lsSet("borrador_"+id, null); S.ed = null; render();
    await borrarDoc("sesiones/"+id); if (borrada) hojaSesion(borrada, true); toast("Sesión borrada");
  }
  else if (a === "timerMas" && S.timer){ S.timer.fin += 15000; S.timer.total += 15; S.timer.pitado = false; pintarTimer(); }
  else if (a === "timerStop"){ S.timer = null; pintarTimer(); }
  else if (a === "suple"){
    const f = b.dataset.f; const d = Object.assign({fecha:f, items:[]}, S.diario[f] || {});
    d.suple = Object.assign({}, d.suple || {}, {[b.dataset.k]: !(d.suple && d.suple[b.dataset.k])});
    guardarDia(f, d);
  }
  else if (a === "diaPrev"){ S.dietaFecha = addDias(S.dietaFecha,-1); render(); }
  else if (a === "diaNext"){ if (S.dietaFecha < hoyISO()) { S.dietaFecha = addDias(S.dietaFecha,1); render(); } }

    const f = S.dietaFecha; const d = Object.assign({}, S.diario[f]);
    d.items = (d.items||[]).filter(i => i.id !== b.dataset.id); guardarDia(f, d);
  }
  else if (a === "delAlimento"){ S.alimentos = S.alimentos.filter(x => x.id!==b.dataset.id); render(); await borrarDoc("alimentos/"+b.dataset.id); }
  else if (a === "delMedida"){ const fm = (S.medidas.find(x => x.id === b.dataset.id) || {}).fecha; S.medidas = S.medidas.filter(x => x.id!==b.dataset.id); render(); await borrarDoc("medidas/"+b.dataset.id); if (fm) hojaMedidas(fm); }
  else if (a === "hojaGuardar"){
    const v = ($("#hoja-url")?.value || "").trim();

      const r = await fetch(v); const j = await r.json();
      if (!j.ok) throw 0;
      lsSet("fitall_hoja_ok", {cuando:new Date().toISOString(), hoja:j.hoja, noEncontrados:[]}); render();
      toast(`Conectada a «${j.hoja}». Enviando tus datos…`); enviarTodo();
    } catch(e){ toast("No pude conectar con esa dirección. Revisa que la copiaste entera y que en «Quién tiene acceso» pusiste «Cualquier usuario»."); }
  }

  else if (a === "importCancelar"){ S.importPend = null; render(); }
  else if (a === "crearRutina"){ S.tab = "ajustes"; S.rutEd = clone(ordenPlan(S.plan||[])); render(); const r = $("[data-act=\"rutAddSes\"]"); if (r) r.scrollIntoView({block:"center"}); }

  }
  else if (a === "alEditar"){ S.alEdit = b.dataset.id; render(); const el = $("#na-nombre"); if (el) { el.scrollIntoView({block:"center"}); el.focus(); } }
  else if (a === "alCancelar"){ S.alEdit = null; render(); }
  else if (a === "itemEditar"){ S.itemEdit = b.dataset.id; render(); }
  else if (a === "itemCancelar"){ S.itemEdit = null; render(); }
  else if (a === "medEditar"){ S.medEdit = b.dataset.id; render(); const el = $("#md-peso"); if (el) { el.scrollIntoView({block:"center"}); el.focus(); } }
  else if (a === "medCancelar"){ S.medEdit = null; render(); }
});
view.addEventListener("submit", async e => {
  const fm = e.target.closest("form[data-form]"); if (!fm) return;
  e.preventDefault();
  const fd = Object.fromEntries(new FormData(fm).entries());
  const k = fm.dataset.form;
  if (k === "pesoHoy"){
    const p = num(fd.peso); if (p==null || p<30 || p>250){ toast("Escribe el peso en kg, por ejemplo 75,4."); return; }
    const f = hoyISO(); const prev = S.medidas.find(m => m.fecha===f) || {};
    const doc = Object.assign({}, prev, {fecha:f, peso:p}); delete doc.id;
    S.medidas = S.medidas.filter(m => m.fecha!==f).concat([Object.assign({id:f}, doc)]).sort((a,b) => a.fecha<b.fecha?-1:1);
    render(); await escribir("medidas/"+f, doc); hojaMedidas(f); toast("Peso guardado");
  }
  else if (k === "addMedida"){
    const f = fd.fecha || hoyISO(); const p = num(fd.peso), c = num(fd.cintura);
    if (p==null && c==null){ toast("Escribe el peso, la cintura o las dos."); return; }
    const editando = S.medEdit;
    let doc;
    if (editando){ doc = {fecha:f}; if (p!=null) doc.peso = p; if (c!=null) doc.cintura = c; }
    else { const prev = S.medidas.find(m => m.fecha===f) || {}; doc = Object.assign({}, prev, {fecha:f}); delete doc.id; if (p!=null) doc.peso = p; if (c!=null) doc.cintura = c; }
    S.medidas = S.medidas.filter(m => m.fecha!==f && m.id!==editando).concat([Object.assign({id:f}, doc)]).sort((a,b) => a.fecha<b.fecha?-1:1);
    S.medEdit = null; render();
    await escribir("medidas/"+f, doc);
    if (editando && editando !== f){ await borrarDoc("medidas/"+editando); hojaMedidas(editando); }
    hojaMedidas(f);
    toast(editando ? "Medida actualizada" : "Medida guardada");
  }
  else if (k === "addItem"){
    const al = alimentoPorNombre(fd.nombre);
    S.ultComida = fd.comida;
    if (!al){ toast("Ese alimento no está en tu lista. Añádelo en «Mis alimentos» o usa «Añadir a mano»."); return; }
    const q = num(fd.cant) ?? (al.unidad==="ud"?1:100);
    const r = q / (al.base||100);
    const f = S.dietaFecha; const d = Object.assign({fecha:f, items:[]}, S.diario[f] || {});
    d.items = (d.items||[]).concat([{id:nuevoId(), comida:fd.comida, nombre:al.nombre, ref:al.id, q, u:al.unidad, cantTxt: al.unidad==="ud" ? `${fmt(q,2)} ud` : `${fmt(q)} ${al.unidad}`,
      kcal:Math.round(al.kcal*r), p:+(al.p*r).toFixed(1), c:+(al.c*r).toFixed(1), g:+(al.g*r).toFixed(1)}]);
    await guardarDia(f, d); toast(`${al.nombre} añadido`);
  }
  else if (k === "addManual"){
    const kc = num(fd.kcal); if (!fd.nombre || kc==null){ toast("Pon al menos un nombre y las kcal."); return; }
    const f = S.dietaFecha; const d = Object.assign({fecha:f, items:[]}, S.diario[f] || {});
    d.items = (d.items||[]).concat([{id:nuevoId(), comida:fd.comida || comidaPorHora(), nombre:fd.nombre.trim(), cantTxt:"a mano", kcal:Math.round(kc), p:num(fd.p)||0, c:num(fd.c)||0, g:num(fd.g)||0}]);
    await guardarDia(f, d); toast("Añadido");
  }
  else if (k === "editItem"){
    const f = S.dietaFecha; const d = Object.assign({}, S.diario[f] || {items:[]});
    const id = fm.dataset.id;
    const kc = num(fd.kcal); if (kc==null){ toast("Las kcal tienen que ser un número."); return; }
    d.items = (d.items||[]).map(i => {
      if (i.id !== id) return i;
      const n = Object.assign({}, i, {nombre:(fd.nombre||i.nombre).trim(), comida:fd.comida || i.comida, kcal:Math.round(kc), p:num(fd.p)||0, c:num(fd.c)||0, g:num(fd.g)||0});
      if (fd.cant != null && num(fd.cant) != null){ n.q = num(fd.cant); n.cantTxt = n.u==="ud" ? `${fmt(n.q,2)} ud` : `${fmt(n.q)} ${n.u||"g"}`; }
      return n;
    });
    S.itemEdit = null;
    await guardarDia(f, d); toast("Cambios guardados");
  }
  else if (k === "addAlimento"){
    const kc = num(fd.kcal); if (!fd.nombre || kc==null){ toast("Pon el nombre y las kcal del alimento."); return; }
    const [base, unidad] = fd.base.split("|");
    const id = S.alEdit || slug(fd.nombre) || nuevoId();
    const doc = {nombre:fd.nombre.trim(), base:+base, unidad, kcal:kc, p:num(fd.p)||0, c:num(fd.c)||0, g:num(fd.g)||0};
    if (fd.nota && fd.nota.trim()) doc.nota = fd.nota.trim();
    const editando = !!S.alEdit;
    S.alimentos = S.alimentos.filter(a => a.id!==id).concat([Object.assign({id}, doc)]).sort((a,b) => a.nombre.localeCompare(b.nombre,"es"));
    S.alEdit = null; render(); await escribir("alimentos/"+id, doc); toast(editando ? "Alimento actualizado" : "Alimento guardado");
  }
});

window.addEventListener("online", () => enviarHoja());
document.getElementById("imp-file").addEventListener("change", e => { const f = e.target.files && e.target.files[0]; e.target.value = ""; if (f) leerCopia(f); });

let toastT = null;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 3200); }

init();
})();
</script>

if ("serviceWorker" in navigator) { window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); }); }
